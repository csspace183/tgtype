<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tgtype</title>
  <link rel="preconnect" href="https://googleapis.com" crossorigin>
  <script>
    if (localStorage.getItem('tgtype_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #222222;
      --muted: #888888;
      --subtle: #999999;
      --border: #e0e0e0;
      --border-light: #eeeeee;
      --surface: #fafafa;
      --hover-bg: #f5f5f5;
      --link: #0066cc;
      --popover-bg: #ffffff;
      --shadow: rgba(0, 0, 0, 0.12);
      --code-bg: #f6f8fa;
      --code-header: #eef1f5;
      --code-inner-bg: #ffffff;
      --code-border: #e1e4e8;
      --code-text: #24292e;

      --hl-kw: #d73a49;
      --hl-str: #032f62;
      --hl-com: #6a737d;
      --hl-tag: #22863a;
      --hl-num: #005cc5;
    }
    html.dark {
      --bg: #1e1e1e;
      --text: #e4e4e4;
      --muted: #9a9a9a;
      --subtle: #7e7e7e;
      --border: #363636;
      --border-light: #2b2b2b;
      --surface: #252525;
      --hover-bg: #2f2f2f;
      --link: #6eb5ff;
      --popover-bg: #262626;
      --shadow: rgba(0, 0, 0, 0.45);
      --code-bg: #252629;
      --code-header: #252629;
      --code-inner-bg: #1b1d21;
      --code-border: #34363b;
      --code-text: #e4e4e4;

      --hl-kw: #c792ea;
      --hl-str: #a5d6ff;
      --hl-com: #8b949e;
      --hl-tag: #7ee787;
      --hl-num: #f78c6c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px 80px;
      color: var(--text);
      background: var(--bg);
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .container { max-width: 730px; margin: 0 auto; position: relative; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 28px;
      margin-bottom: 16px;
    }
    .top-left { display: flex; align-items: center; gap: 16px; }
    .new-link { font-size: 13px; color: var(--subtle); text-decoration: none; }
    .new-link:hover { color: var(--text); }
       /* Кнопка переключения темы рядом с правой границей колонки текста */
    .theme-btn {
      position: fixed;
      top: 40px;
      left: calc(50% + 395px);
      z-index: 95;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      box-shadow: 0 2px 10px var(--shadow);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease, background-color 0.2s ease;
    }

    .theme-btn:hover {
      border-color: var(--text);
      color: var(--text);
      transform: scale(1.06);
    }

    html.dark .theme-btn .icon-light { display: none; }
    html:not(.dark) .theme-btn .icon-dark { display: none; }
    .publish-btn {
      position: relative;
      overflow: hidden;
      z-index: 1;
      background: var(--bg);
      color: var(--text);
      border: 2px solid var(--text);
      border-radius: 20px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 11.5px;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .publish-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #28a745;
      transform: scaleX(0);
      transform-origin: right center;
      transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: -1;
    }
        .publish-btn:hover:not(:disabled):not(.is-saved):not(.is-saving) { background: var(--text); color: var(--bg); }
    .publish-btn:disabled:not(.is-saved):not(.is-saving) { opacity: 0.35; cursor: default; }
    .editor-header.is-editing .publish-btn:disabled:not(.is-saved):not(.is-saving) {
      display: none !important;
    }
    .publish-btn.is-saving {
      opacity: 1;
      cursor: wait;
      border-color: var(--text);
      color: var(--text);
    }
        .publish-btn.is-saved {
      border-color: #28a745;
      color: #fff;
      opacity: 1;
      cursor: default;
    }
    .publish-btn.is-saved::before {
      transform-origin: left center;
      transform: scaleX(1);
    }
        .publish-btn.is-sliding-right {
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), color 0.35s ease, border-color 0.35s ease;
    }
    .cancel-edit-btn.is-hiding {
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .publish-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
         .cancel-edit-btn {
      display: none;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 6px 11px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .cancel-edit-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }
    /* Кнопка «Наверх» на одной линии с кнопками справа от текста */
    .scroll-top-btn {
      position: fixed;
      bottom: 28px;
      left: calc(50% + 395px);
      z-index: 95;

      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      box-shadow: 0 2px 10px var(--shadow);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .scroll-top-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .scroll-top-btn:hover {
      border-color: var(--text);
      color: var(--text);
      transform: translateY(-2px);
    }



    .editable { outline: none; width: 100%; box-sizing: border-box; word-wrap: break-word; }
    .editable:empty:before {
      content: attr(data-placeholder);
      color: var(--subtle);
      pointer-events: none;
      display: block;
    }
    /* Экран загрузки страницы при обращении к базе */
    .page-loader {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.15s ease;
    }
    .page-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--border-light);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: tgSpin 0.75s linear infinite;
    }
    .loader-text {
      font-size: 13px;
      color: var(--muted);
    }
    @keyframes tgSpin {
      to { transform: rotate(360deg); }
    }
       /* Шапка редактора */
    .editor-header {
      background: var(--bg);
      transition: box-shadow 0.2s ease, background-color 0.2s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.32s ease;
    }
    .editor-header-inner {
      max-width: 730px;
      margin: 0 auto;
    }
    .editor-header.is-fixed {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 80;
      background: var(--bg);
      padding: 12px 20px 10px;
      border-bottom: 1px solid var(--border-light);
      box-shadow: 0 4px 16px var(--shadow);
      transform: translateY(0);
      opacity: 1;
    }
    .editor-header.is-fixed.is-closing,
    .editor-header.is-fixed.is-opening {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .editor-header.is-fixed .top-bar { margin-bottom: 8px; }
    .editor-header.is-fixed .title-wrap { margin-bottom: 4px; }
    .editor-header.is-fixed #title {
      font-size: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .editor-header.is-fixed #metaInfo { margin-bottom: 10px; font-size: 12px; }
    .editor-header.is-fixed .toolbar-row { margin-bottom: 0; }
    .editor-header.is-fixed .side-label { font-size: 18px; }

    .title-wrap {
      position: relative;
      margin-bottom: 10px;
    }
    #title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
    }
    .side-label {
      position: absolute;
      right: calc(100% + 16px);
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      padding-right: 14px;
      border-right: 1px solid var(--border);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 24px;
      font-weight: 400;
      color: var(--subtle);
      pointer-events: none;
      user-select: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
       .side-label.visible { opacity: 1; }
    .side-label.is-hiding { opacity: 0 !important; transition: opacity 0.2s ease; }
    @media (max-width: 960px) {
      .side-label { display: none; }
    }
    #metaInfo {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 16px;
      min-height: 18px;
    }
    #metaInfo.no-toolbar { margin-bottom: 28px; }
    /* Строка с панелью инструментов и кнопкой ОПУБЛИКОВАТЬ вровень (всегда в 1 линию) */
    .toolbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      min-height: 44px;
    }
    .toolbar {
      display: flex;
      gap: 5px;
      flex-wrap: nowrap;
      align-items: center;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .toolbar::-webkit-scrollbar {
      display: none;
    }

    .toolbar-row.view-mode .toolbar,
    .toolbar-row.is-collapsing .toolbar {
      opacity: 0;
      pointer-events: none;
    }
    .toolbar-row.hidden { display: none; }
    .publish-btn .edit-pencil-icon {
      display: none;
    }
    @keyframes editBtnFadeIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
        .toolbar-row.view-mode .publish-btn.is-scrolled {
      position: fixed;
      top: 86px;
      left: calc(50% + 395px);
      z-index: 94;
      box-shadow: 0 2px 10px var(--shadow);
      animation: editBtnFadeIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (max-width: 1180px) {
      .theme-btn {
        left: auto;
        right: 24px;
      }
      .toolbar-row.view-mode .publish-btn.is-scrolled {
        left: auto;
        right: 24px;
      }
      .scroll-top-btn {
        left: auto;
        right: 24px;
      }
    }
    @media (max-width: 768px) {
      .theme-btn {
        position: fixed;
        top: 16px;
        left: auto;
        right: 16px;
        z-index: 95;
      }
      .toolbar-row {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .publish-group {
        justify-content: flex-end;
      }
      .toolbar {
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 2px;
      }
      .toolbar-row.view-mode .publish-btn.is-scrolled {
        position: fixed;
        top: 16px;
        left: auto;
        right: 58px;
        z-index: 94;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 2px 10px var(--shadow);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        animation: editBtnFadeIn 0.25s ease;
      }
      .toolbar-row.view-mode .publish-btn.is-scrolled .btn-label {
        display: none;
      }
      .toolbar-row.view-mode .publish-btn.is-scrolled .edit-pencil-icon {
        display: block;
      }
      .scroll-top-btn {
        left: auto;
        right: 16px;
        bottom: 16px;
      }
    }

    .tool-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 1px;
      flex-shrink: 0;
    }
    .tool-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 7px;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 28px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Выпадающее меню выравнивания */
    .align-wrap {
      position: relative;
      display: inline-flex;
    }
    .align-popover {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 95;
      background: var(--popover-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px;
      gap: 4px;
      align-items: center;
      box-shadow: 0 6px 18px var(--shadow);
    }
    .align-popover.open { display: flex; }
    .align-opt {
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      width: 32px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--muted);
      padding: 0;
    }
    .align-opt:hover {
      background: var(--hover-bg);
      color: var(--text);
    }
    .align-opt.active {
      background: var(--hover-bg);
      border-color: var(--border);
      color: var(--text);
    }

    /* Палитра цветов текста */
    .color-wrap {
      position: relative;
      display: inline-flex;
    }
    .color-btn-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      font-weight: 700;
      font-size: 13px;
    }
    .color-bar {
      width: 13px;
      height: 2.5px;
      background-image: linear-gradient(90deg, #ff3b30, #ff9500, #ffcc00, #34c759, #007aff, #af52de);
      margin-top: 2px;
      border-radius: 1px;
    }
    .color-popover {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 95;
      background: var(--popover-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 8px;
      gap: 6px;
      align-items: center;
      box-shadow: 0 6px 18px var(--shadow);
    }
    .color-popover.open { display: flex; }
    .color-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(128, 128, 128, 0.35);
      cursor: pointer;
      padding: 0;
      transition: transform 0.12s ease;
    }
    .color-swatch:hover { transform: scale(1.18); }
         #story {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 18px;
      line-height: 1.58;
      min-height: 350px;
    }

    #story p, #story div { margin: 0; line-height: 1.58; }
    #story h3 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      margin: 18px 0 8px;
    }
    #story blockquote { margin: 12px 0; padding-left: 16px; border-left: 3px solid var(--text); }
    #story ul { margin: 12px 0; padding-left: 24px; }
    #story li {
      margin: 0 0 13px;
      padding-left: 6px;
      line-height: 1.55;
    }
    #story li:last-child { margin-bottom: 0; }
    #story img { max-width: 100%; height: auto; display: block; margin: 18px 0; border-radius: 4px; }
        #story a { color: var(--link); text-decoration: underline; cursor: pointer; }
    #story a font[color], #story a span[style*="color"], #story font[color] a, #story span[style*="color"] a {
      color: inherit;
    }
    html.dark #story [style*="color: rgb(34, 34, 34)"],
    html.dark #story [style*="color: rgb(0, 0, 0)"],
    html.dark #story [style*="color:#222"],
    html.dark #story [style*="color: #222"],
    html.dark #story [style*="color:#000"],
    html.dark #story [style*="color: #000"] {
      color: var(--text) !important;
    }
    /* Блок кода / промпта: карточка с заголовком, превью в несколько строк и нижней панелью */
        #story .tg-code-block {
      margin: 18px 0;
      border-radius: 12px;
      border: 1px solid var(--code-border);
      background: var(--code-bg);
      background-clip: padding-box;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

      .tg-code-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 14px 4px;
      background: var(--code-header);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .tg-code-head-left, .tg-code-head-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
       .tg-code-lang {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      outline: none;
      min-width: 40px;
    }
         .tg-code-tag-wrap {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 600;
      color: #1e8e3e;
    }
    .tg-code-tag-wrap.is-empty {
      display: none;
    }
    #story[contenteditable="true"] .tg-code-tag-wrap.is-empty {
      display: inline-flex;
      opacity: 0.65;
    }
    .tg-code-tag {
      outline: none;
      color: #1e8e3e;
      min-width: 6px;
    }
    .tg-code-tag font[color],
    .tg-code-tag span[style*="color"] {
      color: inherit;
    }
    .tg-code-tag:empty::before {
      content: "подпись...";
      color: #1e8e3e;
      opacity: 0.7;
      pointer-events: none;
    }
           .site-ver-badge {
      display: none;
      position: fixed;
      top: 18px;
      left: calc(50% + 395px);
      z-index: 94;

      font-size: 11px;
      font-weight: 600;
      color: #58a6ff;
      pointer-events: none;
      user-select: none;
    }
    body.is-admin-user .site-ver-badge {
      display: inline-block;
    }
    @media (max-width: 1180px) {
      .site-ver-badge {
        left: auto;
        right: 24px;
      }
    }
    @media (max-width: 768px) {
      .site-ver-badge {
        position: static;
        margin-right: 8px;
      }
    }

    .tg-code-foot-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tg-code-edit {
      background: none;
      color: var(--muted);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 11.5px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .tg-code-edit:hover {
      color: var(--text);
      border-color: var(--text);
    }
    #story[contenteditable="true"] .tg-code-edit,
    .no-edit-rights .tg-code-edit {
      display: none !important;
    }
        .tg-code-head-toggle {
      background: none;
      color: var(--muted);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 11.5px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .tg-code-head-toggle:hover {
      color: var(--text);
      border-color: var(--text);
    }
    .tg-code-head-copy {
      background: none;
      color: var(--muted);
      border: 1px solid var(--code-border);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11.5px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;

    .views-modal-box { max-width: 380px; }

    const ADMIN_LOGIN = 'lordman';

    // Переключение тёмной / светлой темы

    function showLoader() {
      if (pageLoader) {

    let currentUser = null;
    let currentArticleOwner = null;
    let currentArticleViews = 0;
    let currentArticleViewsLog = [];
    let currentArticleIsPrivate = false;
    let lockedPrivateArticle = false;
    let viewCountedForSlug = false;
    let savedLinkRange = null;
    let savedBtnTimer = null;
    let logoutMsgTimer = null;
    let isManualLogout = false;

    const pathSlug = window.location.pathname.replace(/^\/+|\/+$/g, '');
    let currentSlug = pathSlug;
    let isViewMode = false;

    if (pathSlug) {
      showLoader();
    }

    // Автосохранение и восстановление черновика для новой записи на /
    function saveDraftToLocal() {
      if (currentSlug || isViewMode) return;
      const hasTitle = titleEl.innerText.trim().length > 0;
      const hasStory = storyEl.innerText.trim().length > 0 || storyEl.querySelector('img, iframe, .tg-code-block');
      if (!hasTitle && !hasStory) {
        localStorage.removeItem(DRAFT_KEY);
        return;
      }
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({
          title: titleEl.innerHTML,
          story: storyEl.innerHTML,
          at: Date.now()
        }));
      } catch (e) {}
    }

    function clearDraftFromLocal() {
      localStorage.removeItem(DRAFT_KEY);
    }

    newPostLink.addEventListener('click', () => {
      clearDraftFromLocal();
    });

    let initialSnapshot = { title: '', story: '', meta: '' };

    function getCurrentSnapshot() {
      return {
        title: titleEl.innerHTML,
        story: storyEl.innerHTML,
        meta: metaInfoEl.innerText.trim()
      };
    }

    function captureInitialSnapshot() {
      initialSnapshot = getCurrentSnapshot();
      updatePublishState();
    }

    function hasUnsavedChanges() {
      const cur = getCurrentSnapshot();
      if (cur.title !== initialSnapshot.title) return true;
      if (cur.story !== initialSnapshot.story) return true;
      if (currentUser && isAdmin(currentUser) && cur.meta !== initialSnapshot.meta) return true;
      return false;
    }

    function updatePublishState() {
      if (actionBtn.classList.contains('is-saved')) {
        actionBtn.disabled = false;
        return;
      }
      if (isViewMode) {
        actionBtn.disabled = false;
        return;
      }
      actionBtn.disabled = !hasUnsavedChanges();
    }

    captureInitialSnapshot();

    // Восстанавливаем черновик, если открыта главная страница /
    if (!pathSlug) {
      try {
        const rawDraft = localStorage.getItem(DRAFT_KEY);
        if (rawDraft) {
          const parsed = JSON.parse(rawDraft);
          if (parsed && (parsed.title || parsed.story)) {
            titleEl.innerHTML = parsed.title || '';
            storyEl.innerHTML = parsed.story || '';
            updatePublishState();
          }
        }
      } catch (e) {}
    }
        function updateFixedHeader(animateOpen = false) {
      const scrolled = window.scrollY > 28;
      themeBtn.classList.toggle('is-scrolled', scrolled);
      actionBtn.classList.toggle('is-scrolled', scrolled && isViewMode);
      scrollTopBtn.classList.toggle('visible', window.scrollY > 300);

      if (!editorHeader.classList.contains('is-editing')) {
        editorHeader.classList.remove('is-fixed', 'is-opening', 'is-closing');
        headerSpacer.style.display = 'none';
        return;
      }
      const triggerY = 95;
      if (window.scrollY > triggerY) {
        if (!editorHeader.classList.contains('is-fixed')) {
          const fullH = editorHeader.offsetHeight;
          headerSpacer.style.height = fullH + 'px';
          headerSpacer.style.display = 'block';
          if (animateOpen) {
            editorHeader.classList.add('is-fixed', 'is-opening');
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                editorHeader.classList.remove('is-opening');
              });
            });
          } else {
            editorHeader.classList.add('is-fixed');
          }
        }
           } else {
        editorHeader.classList.remove('is-fixed', 'is-opening');
        headerSpacer.style.display = 'none';
      }
    }

    window.addEventListener('scroll', updateFixedHeader, { passive: true });

    window.addEventListener('resize', () => {
      if (editorHeader.classList.contains('is-fixed')) {
        editorHeader.classList.remove('is-fixed');
        headerSpacer.style.height = editorHeader.offsetHeight + 'px';
        editorHeader.classList.add('is-fixed');
      }
    });

    function updateTitleSideLabel() {
      const hasText = titleEl.innerText.trim().length > 0;
      if (!hasText && titleEl.innerHTML !== '') {
        titleEl.innerHTML = '';
      }
      const canEdit = titleEl.isContentEditable;
      titleSideLabel.classList.toggle('visible', hasText && canEdit);
    }
    updateTitleSideLabel();

    titleEl.addEventListener('input', () => {
      updateTitleSideLabel();
      updatePublishState();
      saveDraftToLocal();
    });
    metaInfoEl.addEventListener('input', updatePublishState);
    function formatRuDate(timestamp) {
      if (!timestamp) return '—';
      return new Date(timestamp).toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }

    function renderMeta(login, timestamp) {
      const parts = [];
      if (login) parts.push(login);
      if (timestamp) parts.push(formatRuDate(timestamp));
      metaInfoEl.textContent = parts.join(' • ');
    }

    function setStatus(text, kind) {
      statusEl.textContent = text || '';
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    function getLoginName(user) {
      return user && user.email ? user.email.split('@').at(0) : '';
    }

    function isAdmin(user) {
      return getLoginName(user) === ADMIN_LOGIN;
    }

    function placeCaretAtEnd(el) {
      if (!el) return;
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    // Подсветка синтаксиса для блока кода с автоопределением языка
    const COPY_ICON_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function detectCodeLanguage(raw) {
      const s = (raw || '').trim();
      if (!s) return 'code';
      if (/<!DOCTYPE|<html|<div|<script|<style|<\/[a-z]+>/i.test(s)) return 'html';
      if (/\b(const|let|var|function|async|await|document\.|window\.|=>)\b/.test(s)) return 'javascript';
      if (/\b(def |import |from |elif |print\(|None|True|False)\b/.test(s)) return 'python';
      if (/^###?\s|^\s*-\s+\*\*/m.test(s)) return 'markdown';
      if (/\{[\s\S]*?:[\s\S]*?;[\s\S]*?\}/.test(s) && !/\bfunction\b/.test(s)) return 'css';
      return 'code';
    }

    function highlightCodeText(raw) {
      let html = escapeHtml(raw);
      const tokens = [];
      const saveTok = (cls, text) => {
        const id = `\u0000TOK${tokens.length}\u0000`;
        tokens.push(`<span class="${cls}">${text}</span>`);
        return id;
      };

      html = html.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*)/g, m => saveTok('hl-com', m));
      html = html.replace(/(&lt;\/?[a-zA-Z0-9-]+(?:\s+[^&]*?)?\/?&gt;)/g, m => saveTok('hl-tag', m));
      html = html.replace(/(&quot;[^&\n]*?&quot;|'[^'\n]*?'|`[^`]*?`)/g, m => saveTok('hl-str', m));
      html = html.replace(/\b(const|let|var|function|return|if|else|for|while|async|await|try|catch|finally|class|import|from|export|default|new|true|false|null|undefined|def|print|elif|None|True|False)\b/g, '<span class="hl-kw">$1</span>');
      html = html.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="hl-num">$1</span>');

      return html.replace(/\u0000TOK(\d+)\u0000/g, (_, idx) => tokens[Number(idx)]);
    }

    function getCaretOffsetIn(root) {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount || !root.contains(sel.anchorNode)) return null;
      const range = sel.getRangeAt(0);
      const pre = range.cloneRange();
      pre.selectNodeContents(root);
      pre.setEnd(range.endContainer, range.endOffset);
      return pre.toString().length;
    }

    function setCaretOffsetIn(root, offset) {
      if (offset === null || offset === undefined) return;
      const sel = window.getSelection();
      const range = document.createRange();
      let current = 0;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      let node;
      while ((node = walker.nextNode())) {
        const next = current + node.nodeValue.length;
        if (offset <= next) {
          range.setStart(node, Math.max(0, offset - current));
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
          return;
        }
        current = next;
      }
      range.selectNodeContents(root);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }
        function updateCodeToggleUI(block) {
      if (!block) return;
      const toggleBtn = block.querySelector('.tg-code-toggle');
      const headToggleBtn = block.querySelector('.tg-code-head-toggle');
      const preEl = block.querySelector('pre');
      if (!preEl) return;
      const isShort = preEl.scrollHeight <= 60;
      block.classList.toggle('is-short', isShort);
      if (isShort) {
        block.classList.remove('is-collapsed');
        if (headToggleBtn) headToggleBtn.style.display = 'none';
        return;
      }
      if (headToggleBtn) headToggleBtn.style.display = 'inline-flex';
      const collapsed = block.classList.contains('is-collapsed');
      if (toggleBtn) toggleBtn.textContent = collapsed ? 'Развернуть ▾' : 'Свернуть ▴';
      if (headToggleBtn) headToggleBtn.textContent = collapsed ? 'Развернуть ▾' : 'Свернуть ▴';
    }

    function normalizeCodeBlockStructure(block) {
      if (!block) return;
      const head = block.querySelector('.tg-code-head');
      const pre = block.querySelector('pre');
      if (head && pre && !block.querySelector('.tg-code-body')) {
        const bodyWrap = document.createElement('div');
        bodyWrap.className = 'tg-code-body';
        pre.replaceWith(bodyWrap);
        bodyWrap.appendChild(pre);
      }
      if (head && !head.querySelector('.tg-code-head-left')) {
        const langEl = head.querySelector('.tg-code-lang');
        const delBtn = head.querySelector('.tg-code-del');
        const langText = langEl ? langEl.textContent : 'code';
        const isCustom = langEl?.dataset?.customTitle === '1';

        const left = document.createElement('div');
        left.className = 'tg-code-head-left';
        const newLang = document.createElement('span');
        newLang.className = 'tg-code-lang';
        newLang.textContent = langText;
        if (isCustom) newLang.dataset.customTitle = '1';
        left.appendChild(newLang);

        const right = document.createElement('div');
        right.className = 'tg-code-head-right';
        if (delBtn) right.appendChild(delBtn);

        head.innerHTML = '';
        head.appendChild(left);
        head.appendChild(right);
      }
      const leftBox = head?.querySelector('.tg-code-head-left');
      const rightBox = head?.querySelector('.tg-code-head-right');
      const oldLeftToggle = leftBox?.querySelector('.tg-code-head-toggle');
      if (oldLeftToggle) oldLeftToggle.remove();
      const oldDevVer = leftBox?.querySelector('.tg-code-dev-ver');
      if (oldDevVer) oldDevVer.remove();

      if (leftBox && !leftBox.querySelector('.tg-code-tag-wrap')) {
        const tagWrap = document.createElement('span');
        tagWrap.className = 'tg-code-tag-wrap is-empty';
        tagWrap.innerHTML = '• <span class="tg-code-tag" spellcheck="false"></span>';
        leftBox.appendChild(tagWrap);
      }
      const tagWrapEl = leftBox?.querySelector('.tg-code-tag-wrap');
      const tagTextEl = tagWrapEl?.querySelector('.tg-code-tag');
      if (tagWrapEl && tagTextEl) {
        tagWrapEl.classList.toggle('is-empty', !tagTextEl.textContent.trim());
      }

            const oldRightToggle = rightBox?.querySelector('.tg-code-head-toggle');
      if (oldRightToggle) oldRightToggle.remove();
      const oldEditBtn = rightBox?.querySelector('.tg-code-edit');
      if (oldEditBtn) oldEditBtn.remove();
      if (leftBox && !leftBox.querySelector('.tg-code-head-toggle')) {
        const headToggle = document.createElement('button');
        headToggle.type = 'button';
        headToggle.className = 'tg-code-head-toggle';
        headToggle.textContent = 'Развернуть ▾';
        leftBox.appendChild(headToggle);
      }
      if (leftBox && !leftBox.querySelector('.tg-code-head-copy')) {
        const headCopy = document.createElement('button');
        headCopy.type = 'button';
        headCopy.className = 'tg-code-head-copy tg-code-copy';
        headCopy.title = 'Скопировать';
        headCopy.innerHTML = COPY_ICON_SVG;
        leftBox.appendChild(headCopy);
      }


      let foot = block.querySelector('.tg-code-foot');

      if (!foot) {
        foot = document.createElement('div');
        foot.className = 'tg-code-foot';
        block.appendChild(foot);
      }
      foot.innerHTML = `
        <button type="button" class="tg-code-toggle">Развернуть ▾</button>
        <button type="button" class="tg-code-copy" title="Скопировать">${COPY_ICON_SVG}</button>
      `;
    }

    function applyCodeHighlight(codeEl, preserveCaret = false) {
      if (!codeEl) return;
      const caretPos = preserveCaret ? getCaretOffsetIn(codeEl) : null;
      const raw = (codeEl.textContent || '').replace(/class="hl-(?:com|str|tag|kw|num)">/g, '');
      codeEl.innerHTML = raw ? highlightCodeText(raw) : '';
      const block = codeEl.closest('.tg-code-block');
      normalizeCodeBlockStructure(block);
      const langLabel = block?.querySelector('.tg-code-lang');
      if (langLabel && !langLabel.dataset.customTitle) {
        langLabel.textContent = detectCodeLanguage(raw);
      }
      updateCodeToggleUI(block);
      if (preserveCaret && caretPos !== null) {
        setCaretOffsetIn(codeEl, caretPos);
      }
    }

    function refreshAllCodeBlocks(collapseAll = false) {
      storyEl.querySelectorAll('.tg-code-block').forEach(block => {
        normalizeCodeBlockStructure(block);
        const code = block.querySelector('code');
        if (code) applyCodeHighlight(code, false);
        if (collapseAll) block.classList.add('is-collapsed');
        updateCodeToggleUI(block);
      });
    }
    function syncCodeEditableState() {
      const canEdit = storyEl.isContentEditable;
      storyEl.querySelectorAll('.tg-code-block code').forEach(code => {
        code.contentEditable = canEdit ? 'true' : 'false';
      });
      storyEl.querySelectorAll('.tg-code-block .tg-code-lang').forEach(lang => {
        lang.contentEditable = canEdit ? 'true' : 'false';
      });
      storyEl.querySelectorAll('.tg-code-block .tg-code-tag').forEach(tag => {
        tag.contentEditable = canEdit ? 'true' : 'false';
      });
    }

    codeBtn.addEventListener('mousedown', e => e.preventDefault());
    codeBtn.addEventListener('click', () => {
      colorPopover.classList.remove('open');
      alignPopover.classList.remove('open');

      const block = document.createElement('div');
      block.className = 'tg-code-block';
      block.setAttribute('contenteditable', 'false');
            block.innerHTML = `
                        <div class="tg-code-head">
          <div class="tg-code-head-left">
            <span class="tg-code-lang" contenteditable="true" spellcheck="false">code</span>
            <span class="tg-code-tag-wrap is-empty">• <span class="tg-code-tag" contenteditable="true" spellcheck="false"></span></span>
            <button type="button" class="tg-code-head-toggle" style="display:none;">Развернуть ▾</button>
            <button type="button" class="tg-code-head-copy tg-code-copy" title="Скопировать">${COPY_ICON_SVG}</button>
          </div>
          <div class="tg-code-head-right">
            <button type="button" class="tg-code-del" title="Удалить блок">✕</button>
          </div>
        </div>


        <div class="tg-code-body">
          <pre><code contenteditable="true" spellcheck="false"></code></pre>
        </div>
        <div class="tg-code-foot">
          <button type="button" class="tg-code-toggle" style="visibility:hidden;">Развернуть ▾</button>
          <button type="button" class="tg-code-copy" title="Скопировать">${COPY_ICON_SVG}</button>

    function parseYandexMusicEmbed(text) {
      const trimmed = (text || '').trim();
      const iframeMatch = trimmed.match(/<iframe\b[^>]*\bsrc=["'](https?:\/\/[^"']+)["'][^>]*>/i);
      if (!iframeMatch) return null;

      const src = iframeMatch.at(1);
      const allowedHosts = /^(?:music\.yandex\.(?:ru|by|kz|uz|com)|(?:[\w-]+\.)?vk\.com|(?:[\w-]+\.)?vk\.ru|(?:[\w-]+\.)?vkvideo\.ru|(?:[\w-]+\.)?rutube\.ru|(?:[\w-]+\.)?dzen\.ru|(?:[\w-]+\.)?zvuk\.com|(?:[\w-]+\.)?yandex\.ru|(?:[\w-]+\.)?youtube\.com|(?:[\w-]+\.)?youtube-nocookie\.com)$/i;
      try {
        const urlObj = new URL(src);
        if (!allowedHosts.test(urlObj.hostname)) return null;

        const isTall = /\/iframe\/album\/\d+\/?(?:$|\?)/i.test(src) || /video|embed|map-widget/i.test(src);
        return { src: src, isAlbum: isTall };
      } catch (e) {
        return null;
      }
    }

    function sanitizePastedHtml(rawHtml) {
      const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
      const allowedTags = new Set([
        'P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'DEL',
        'H1', 'H2', 'H3', 'H4', 'BLOCKQUOTE', 'UL', 'OL', 'LI', 'A', 'SPAN', 'DIV', 'FONT'
      ]);

      function cleanNode(node) {
        if (node.nodeType === 3) {
          return document.createTextNode(node.nodeValue);
        }
        if (node.nodeType !== 1) return null;

        const tag = node.tagName.toUpperCase();
        if (['STYLE', 'SCRIPT', 'META', 'LINK', 'XML', 'HEAD', 'TITLE', 'IFRAME', 'OBJECT'].includes(tag)) {
          return null;
        }

        const frag = document.createDocumentFragment();
        for (const child of Array.from(node.childNodes)) {
          const cleanedChild = cleanNode(child);
          if (cleanedChild) frag.appendChild(cleanedChild);
        }

        if (!allowedTags.has(tag)) {
          return frag;
        }

        let targetTag = tag.toLowerCase();
        if (['H1', 'H2', 'H4'].includes(tag)) targetTag = 'h3';
        if (tag === 'OL') targetTag = 'ul';
        if (tag === 'FONT') targetTag = 'span';

        const el = document.createElement(targetTag);

        if (['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'BLOCKQUOTE'].includes(tag)) {
          const align = (node.style && node.style.textAlign) || node.getAttribute('align');
          if (align && ['center', 'right', 'left', 'justify'].includes(align.toLowerCase())) {
            el.style.textAlign = align.toLowerCase();
          }
        }

        const textColor = (node.style && node.style.color) || node.getAttribute('color');
        if (textColor) {
          el.style.color = textColor;
        }

        if (tag === 'A') {
          const href = node.getAttribute('href');
          if (href && /^https?:\/\//i.test(href.trim())) {
            el.href = href.trim();
            el.target = '_blank';
          } else {
            return frag;
          }
        }

        el.appendChild(frag);
        return el;
      }

      const container = document.createElement('div');
      for (const child of Array.from(doc.body.childNodes)) {
        const cleaned = cleanNode(child);
        if (cleaned) container.appendChild(cleaned);
      }
      return container.innerHTML;
    }

        const plainCode = cd ? cd.getData('text/plain') : '';
        if (plainCode) {
          document.execCommand('insertText', false, plainCode);
          applyCodeHighlight(targetCode, true);
          updatePublishState();
          saveDraftToLocal();
        }
        return;
      }

      const items = cd ? cd.items : [];
      for (const item of items) {
        if (item.kind === 'file' && item.type.indexOf('image') === 0) {
          e.preventDefault();
          compressAndInsertImage(item.getAsFile());
          return;
        }
      }

      e.preventDefault();
      const text = cd ? cd.getData('text/plain') : '';
      if (text) {
        const ym = parseYandexMusicEmbed(text);
        if (ym) {
          insertYandexMusicEmbed(ym);
          return;
        }
      }

      const html = cd ? cd.getData('text/html') : '';
      if (html) {
        const cleanHtml = sanitizePastedHtml(html);
        if (cleanHtml.trim()) {
          document.execCommand('insertHTML', false, cleanHtml);
          updatePublishState();
          saveDraftToLocal();
          return;
        }
      }

      if (text) {
        document.execCommand('insertText', false, text);
        updatePublishState();
        saveDraftToLocal();
      }
    });

    function compressAndInsertImage(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = event => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 850;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
            height = Math.round(height * MAX_WIDTH / width);
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          storyEl.focus();
          document.execCommand('insertHTML', false, `<img src="${dataUrl}"><br>`);
          updatePublishState();
          saveDraftToLocal();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function trackArticleView(slug) {
      if (!db || !slug || !isViewMode || lockedPrivateArticle) return;

      const key = 'tgtype_v_' + slug;
      const guestTs = Number(localStorage.getItem(key + '_guest_at') || 0);
      const viewerLogin = currentUser ? getLoginName(currentUser) : '';

      // Если пользователь раньше открыл эту статью как Гость, а затем вошёл в аккаунт — заменяем Гостя на его логин
      if (viewerLogin && guestTs > 0) {
        localStorage.removeItem(key + '_guest_at');
        if (currentUser.uid !== currentArticleOwner && !isAdmin(currentUser)) {
          try {
            const snap = await db.collection('articles').doc(slug).get();
            if (snap.exists) {
              const log = Array.isArray(snap.data().viewsLog) ? [...snap.data().viewsLog] : [];
              const idx = log.findIndex(item => !item.user && item.at === guestTs);
              if (idx > -1) {
                log[idx] = { user: viewerLogin, at: guestTs };
                await db.collection('articles').doc(slug).update({ viewsLog: log });
                currentArticleViewsLog = log;
                updateViewsBadge();
              }
            }
          } catch (e) {}
        }
        return;
      }

      if (viewCountedForSlug) return;
      if (currentUser && (currentUser.uid === currentArticleOwner || isAdmin(currentUser))) return;
      if (localStorage.getItem(key)) return;

      viewCountedForSlug = true;
      localStorage.setItem(key, '1');
      const nowTs = Date.now();
      if (!viewerLogin) {
        localStorage.setItem(key + '_guest_at', String(nowTs));
      }
      const entry = { user: viewerLogin, at: nowTs };

      try {
        await db.collection('articles').doc(slug).update({
          views: firebase.firestore.FieldValue.increment(1),
          viewsLog: firebase.firestore.FieldValue.arrayUnion(entry)
        });
        currentArticleViews += 1;
        currentArticleViewsLog.push(entry);
        updateViewsBadge();
      } catch (e) {
        localStorage.removeItem(key);
        localStorage.removeItem(key + '_guest_at');
        viewCountedForSlug = false;
      }
    }

    function cleanLogin(raw) {

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      modalMsg.textContent = '';

      const login = cleanLogin(loginInput.value);
      const pass = passInput.value;

      if (isRegMode) {
        const lastReg = Number(localStorage.getItem('tgtype_last_reg') || 0);
        if (Date.now() - lastReg < ONE_HOUR) {
          modalMsg.textContent = 'Вы недавно уже создавали аккаунт. Попробуйте позже.';
          return;
        }

        if (!login || login.length < 3) {
          modalMsg.textContent = 'Логин: минимум 3 латинских символа (a-z, 0-9).';
          return;
        }
        if (!pass || pass.length < 6) {
          modalMsg.textContent = 'Пароль: минимум 6 символов.';
          return;
        }

        submitAuthBtn.disabled = true;
        try {
          await auth.createUserWithEmailAndPassword(`${login}@tgtype.local`, pass);
          localStorage.setItem('tgtype_last_reg', String(Date.now()));
          authModal.style.display = 'none';
          showAuthButtonNotice(`Аккаунт создан: ${login}`, 'is-logged-in', `Выйти (${login})`);
        } catch (err) {
          if (err.code === 'auth/email-already-in-use') {
            modalMsg.textContent = 'Этот логин уже занят. Придумайте другой.';
          } else {
            modalMsg.textContent = 'Ошибка регистрации: ' + err.message;
          }
        } finally {
          submitAuthBtn.disabled = false;
        }
      } else {
        const lockUntil = Number(localStorage.getItem('tgtype_login_lock') || 0);
        if (Date.now() < lockUntil) {
          modalMsg.textContent = 'Слишком много неудачных попыток. Повторите попытку позже.';
          return;
        } else if (lockUntil > 0) {
          localStorage.removeItem('tgtype_login_lock');
          localStorage.removeItem('tgtype_login_fails');
        }

        if (!login || !pass) {
          modalMsg.textContent = 'Введите логин и пароль.';
          return;
        }

        submitAuthBtn.disabled = true;
        try {
          await auth.signInWithEmailAndPassword(`${login}@tgtype.local`, pass);
          localStorage.removeItem('tgtype_login_fails');
          localStorage.removeItem('tgtype_login_lock');
          authModal.style.display = 'none';
          showAuthButtonNotice(`Вход выполнен: ${login}`, 'is-logged-in', `Выйти (${login})`);
        } catch (err) {
          if (err.code === 'auth/too-many-requests') {
            localStorage.setItem('tgtype_login_lock', String(Date.now() + ONE_HOUR));
            modalMsg.textContent = 'Слишком много неудачных попыток. Повторите попытку позже.';
          } else {
            const fails = Number(localStorage.getItem('tgtype_login_fails') || 0) + 1;
            if (fails >= 3) {
              localStorage.setItem('tgtype_login_lock', String(Date.now() + ONE_HOUR));
              localStorage.removeItem('tgtype_login_fails');
              modalMsg.textContent = 'Слишком много неудачных попыток. Повторите попытку позже.';
            } else {
              localStorage.setItem('tgtype_login_fails', String(fails));
              modalMsg.textContent = `Неверный логин или пароль. Осталось попыток: ${3 - fails}`;
            }
          }
        } finally {
          submitAuthBtn.disabled = false;
        }
      }

      }
    }

    function parseFirestoreRestDoc(fields) {
      if (!fields) return {};
      const readVal = v => {
        if (!v) return undefined;
        if ('stringValue' in v) return v.stringValue;
        if ('integerValue' in v) return Number(v.integerValue);
        if ('doubleValue' in v) return Number(v.doubleValue);
        if ('booleanValue' in v) return Boolean(v.booleanValue);
        if ('arrayValue' in v) return (v.arrayValue.values || []).map(readVal);
        if ('mapValue' in v) {
          const obj = {};
          const mapFields = v.mapValue.fields || {};
          for (const mk of Object.keys(mapFields)) {
            obj[mk] = readVal(mapFields[mk]);
          }
          return obj;
        }
        return undefined;
      };
      const out = {};
      for (const k of Object.keys(fields)) {
        out[k] = readVal(fields[k]);
      }
      return out;
    }

    async function loadArticle(slug) {
      setEditable(false);
      setStatus('Загрузка...');
      try {
        let exists = false;
        let data = null;

        try {
          const restHost = 'https://firestore.' + 'googleapis.com';
          const restUrl = `${restHost}/v1/projects/tgtype-a41aa/databases/(default)/documents/articles/${encodeURIComponent(slug)}`;
          const res = await fetch(restUrl);
          if (res.status === 200) {
            const json = await res.json();
            exists = true;
            data = parseFirestoreRestDoc(json.fields);
          } else if (res.status === 404) {
            exists = false;
          } else {
            throw new Error('HTTP ' + res.status);
          }
        } catch (restErr) {
          if (!db) throw restErr;
          const snap = await db.collection('articles').doc(slug).get();
          exists = snap.exists;
          data = exists ? snap.data() : null;
        }

        if (exists && data) {
          currentArticleOwner = data.ownerUid || null;
          currentArticleIsPrivate = Boolean(data.isPrivate);

          if (currentArticleIsPrivate) {
            const hasAccess = currentUser && (currentUser.uid === currentArticleOwner || isAdmin(currentUser));
            if (!hasAccess) {
              lockedPrivateArticle = true;
              titleEl.innerHTML = '';
              storyEl.innerHTML = '';
              metaInfoEl.style.display = 'none';
              toolbarRow.style.display = 'none';
              storyEl.style.display = 'none';
              actionBtn.style.display = 'none';
              titleEl.contentEditable = false;
              editorHeader.classList.remove('is-editing');
              updateFixedHeader();
              updateTitleSideLabel();
              titleEl.textContent = 'Доступ ограничен';
              document.title = 'Доступ ограничен — tgtype';
              setStatus('Автор закрыл доступ к этой публикации.', 'error');
              return;
            }
          }

          lockedPrivateArticle = false;
          metaInfoEl.style.display = '';
          toolbarRow.style.display = '';
          storyEl.style.display = '';

                    titleEl.innerHTML = data.title || '';
          storyEl.innerHTML = data.story || '';
          refreshAllCodeBlocks(true);
          syncCodeEditableState();

          currentArticleViews = Number(data.views) || 0;
          currentArticleViewsLog = Array.isArray(data.viewsLog) ? data.viewsLog : [];

          if (data.customMeta !== undefined) {
            metaInfoEl.textContent = data.customMeta;
          } else {
            const rawAuthor = Array.isArray(data.ownerLogin) ? data.ownerLogin.at(0) : (data.ownerLogin || '');
            const authorDisplay = rawAuthor || (data.author ? data.author.replace(/<[^>]*>/g, '').trim() : '');
            renderMeta(authorDisplay, data.updatedAt);
          }
          document.title = titleEl.innerText || 'tgtype';
          setStatus('');
          setActionBtnText('РЕДАКТИРОВАТЬ');
          isViewMode = true;

          captureInitialSnapshot();
          updateEditVisibility();
          updateViewsBadge();
          if (auth) trackArticleView(slug);
        } else {
          metaInfoEl.style.display = 'none';
          toolbarRow.style.display = 'none';
          storyEl.style.display = 'none';
          actionBtn.style.display = 'none';
          titleEl.contentEditable = false;
          editorHeader.classList.remove('is-editing');
          updateFixedHeader();
          updateTitleSideLabel();
          titleEl.textContent = 'Страница не найдена';
          document.title = 'Страница не найдена — tgtype';
          setStatus('Этой страницы не существует.', 'error');
        }
      } catch (e) {
        setStatus('Ошибка загрузки: ' + e.message, 'error');
      } finally {
        hideLoader();
      }
    }
        function finishEditingTransition(restoreInitial = false) {
      const keepY = window.scrollY;
      const storyTopBefore = storyEl.getBoundingClientRect().top;
      if (restoreInitial) {
        titleEl.innerHTML = initialSnapshot.title;
        storyEl.innerHTML = initialSnapshot.story;
        if (currentUser && isAdmin(currentUser)) {
          metaInfoEl.textContent = initialSnapshot.meta;
        }
        refreshAllCodeBlocks(true);
      }

      const rowRect = toolbarRow.getBoundingClientRect();
      const btnRect = actionBtn.getBoundingClientRect();
      const shiftX = Math.max(0, rowRect.right - btnRect.right);

      titleSideLabel.classList.add('is-hiding');
      storyEl.classList.add('is-hiding-code-del');
      toolbarRow.classList.add('is-collapsing');

      if (editorHeader.classList.contains('is-fixed')) {
        editorHeader.classList.add('is-closing');
      }

      const publishWasHidden = getComputedStyle(actionBtn).display === 'none';
      if (publishWasHidden) {
        cancelEditBtn.style.transition = 'opacity 0.24s ease';
        cancelEditBtn.style.opacity = '0';
        setActionBtnText('РЕДАКТИРОВАТЬ');
      } else {
        cancelEditBtn.classList.add('is-hiding');
        actionBtn.classList.add('is-sliding-right');
        if (shiftX > 0 && !editorHeader.classList.contains('is-fixed')) {
          actionBtn.style.transform = `translateX(${shiftX}px)`;
        }
        actionBtn.classList.remove('is-saved');
        setActionBtnText('РЕДАКТИРОВАТЬ');
      }

      savedBtnTimer = setTimeout(() => {
        savedBtnTimer = null;
        actionBtn.classList.remove('is-sliding-right');
        actionBtn.style.transform = '';
        actionBtn.style.opacity = '';
        actionBtn.style.transition = '';
        cancelEditBtn.classList.remove('is-hiding');
        cancelEditBtn.style.opacity = '';
        cancelEditBtn.style.transform = '';
        cancelEditBtn.style.transition = '';
        titleSideLabel.classList.remove('is-hiding');
        storyEl.classList.remove('is-hiding-code-del');
        toolbarRow.classList.remove('is-collapsing');
        editorHeader.classList.remove('is-closing');

        isViewMode = true;
        if (!restoreInitial) captureInitialSnapshot();
        setEditable(false);
        updateEditVisibility();
        updateViewsBadge();
        setStatus('');
        if (keepY > 95) {
          const storyTopAfter = storyEl.getBoundingClientRect().top;
          const diff = storyTopAfter - storyTopBefore;
          if (Math.abs(diff) > 0.5) {
            window.scrollBy({ top: diff, behavior: 'instant' });
          }
        }
      }, 280);
    }

    cancelEditBtn.addEventListener('click', () => {
      if (isViewMode || !currentSlug) return;
      if (savedBtnTimer) clearTimeout(savedBtnTimer);
      finishEditingTransition(true);
    });

    function setEditable(canEdit, animateOpen = false) {
      titleEl.contentEditable = Boolean(canEdit);
      storyEl.contentEditable = Boolean(canEdit);
      syncCodeEditableState();
      cancelEditBtn.style.display = (canEdit && currentSlug) ? 'inline-flex' : 'none';
      toolbarRow.classList.toggle('view-mode', !canEdit);
      if (canEdit) {
        toolbarRow.classList.remove('hidden');
        metaInfoEl.classList.remove('no-toolbar', 'can-edit-btn');
      }
      metaInfoEl.contentEditable = Boolean(canEdit && currentUser && isAdmin(currentUser));
      editorHeader.classList.toggle('is-editing', canEdit);
      updateFixedHeader(animateOpen);
      updateTitleSideLabel();
      updatePublishState();
    }
    function slugify(text) {
      const map = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
      return text.toLowerCase().split('').map(c => map[c] || c).join('')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'post-' + Date.now();
    }

    actionBtn.addEventListener('click', async () => {
      if (!db || !auth) return;
      if (actionBtn.classList.contains('is-saved')) return;

      if (!currentUser) {
        setAuthMode(false);
        authModal.style.display = 'flex';
        loginInput.focus();
        return;
      }
            if (isViewMode) {
        const savedScrollY = window.scrollY;
        const storyTopBefore = storyEl.getBoundingClientRect().top;
        actionBtn.blur();
        isViewMode = false;
        const inMiddle = savedScrollY > 95;
        if (!inMiddle) {
          toolbarRow.classList.add('is-collapsing');
          cancelEditBtn.classList.add('is-hiding');
          titleSideLabel.classList.add('is-hiding');
          storyEl.classList.add('is-hiding-code-del');
        }
        setEditable(true, inMiddle);
        setActionBtnText('ОПУБЛИКОВАТЬ');
        captureInitialSnapshot();
        if (inMiddle) {
          const storyTopAfter = storyEl.getBoundingClientRect().top;
          const diff = storyTopAfter - storyTopBefore;
          if (Math.abs(diff) > 0.5) {
            window.scrollBy({ top: diff, behavior: 'instant' });
          }
        }

        if (!inMiddle) {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              toolbarRow.classList.remove('is-collapsing');
              cancelEditBtn.classList.remove('is-hiding');
              titleSideLabel.classList.remove('is-hiding');
              storyEl.classList.remove('is-hiding-code-del');
            });
          });
        }
        return;
      }

      if (!hasUnsavedChanges()) return;

      const titleText = titleEl.innerText.trim();
      if (!titleText) {
        alert('Введите заголовок!');
        return;
      }
            refreshAllCodeBlocks(false);
      actionBtn.disabled = true;
      actionBtn.classList.add('is-saving');
      setActionBtnText('СОХРАНЕНИЕ...');
      setStatus('')
      try {
        let targetSlug = currentSlug;
        if (!targetSlug) {
          let baseSlug = slugify(titleText);
          targetSlug = baseSlug;
          let counter = 1;
          while ((await db.collection('articles').doc(targetSlug).get()).exists) {
            targetSlug = `${baseSlug}${counter++}`;
          }
        }

        const now = Date.now();
        const payload = {
          title: titleEl.innerHTML,
          story: storyEl.innerHTML,
          updatedAt: now
        };

        if (isAdmin(currentUser)) {
          payload.customMeta = metaInfoEl.innerText.trim();
        } else {
          payload.customMeta = firebase.firestore.FieldValue.delete();
        }

        if (!currentArticleOwner) {
          payload.ownerUid = currentUser.uid;
          payload.ownerLogin = getLoginName(currentUser);
          currentArticleOwner = currentUser.uid;
        }

        await db.collection('articles').doc(targetSlug).set(payload, { merge: true });
        clearDraftFromLocal();

        if (isAdmin(currentUser)) {
          metaInfoEl.textContent = payload.customMeta;
        } else {
          renderMeta(payload.ownerLogin || getLoginName(currentUser), now);
        }

        currentSlug = targetSlug;
        window.history.pushState({}, '', '/' + targetSlug);
        document.title = titleText;
        setStatus('');
                // 1. Заливаем кнопку зелёным слева направо
        actionBtn.classList.remove('is-saving');
        actionBtn.disabled = false;
        setActionBtnText('СОХРАНЕНО');
        actionBtn.classList.add('is-saved');
        if (savedBtnTimer) clearTimeout(savedBtnTimer);
        savedBtnTimer = setTimeout(() => {
          finishEditingTransition(false);
        }, 1100);

      } catch (e) {
        actionBtn.classList.remove('is-saving');
        setActionBtnText('ОПУБЛИКОВАТЬ');
        setStatus('Ошибка публикации: ' + e.message, 'error');
        updatePublishState();
      }

    });
  </script>
