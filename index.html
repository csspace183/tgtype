<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tgtype</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px 80px;
      color: #222;
      background: #fff;
    }
    .container { max-width: 730px; margin: 0 auto; position: relative; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 24px;
      margin-bottom: 16px;
    }
    .top-left { display: flex; align-items: center; gap: 16px; }
    .new-link { font-size: 13px; color: #999; text-decoration: none; }
    .new-link:hover { color: #222; }
    .publish-btn {
      background: #fff;
      border: 2px solid #222;
      border-radius: 20px;
      padding: 6px 18px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .publish-btn:hover:not(:disabled) { background: #222; color: #fff; }
    .publish-btn:disabled { opacity: 0.35; cursor: default; }
    .publish-btn.is-saving { opacity: 0.5; cursor: wait; }
    .editable { outline: none; width: 100%; box-sizing: border-box; word-wrap: break-word; }
    .editable:empty:before {
      content: attr(data-placeholder);
      color: #999;
      pointer-events: none;
      display: block;
    }

    /* Шапка редактора */
    .editor-header {
      background: #fff;
      transition: box-shadow 0.15s ease;
    }
    .editor-header-inner {
      max-width: 730px;
      margin: 0 auto;
    }
    .editor-header.is-fixed {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 80;
      background: #fff;
      padding: 12px 20px 10px;
      border-bottom: 1px solid #eee;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .editor-header.is-fixed .top-bar {
      margin-bottom: 8px;
    }
    .editor-header.is-fixed .title-wrap {
      margin-bottom: 4px;
    }
    .editor-header.is-fixed #title {
      font-size: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .editor-header.is-fixed #metaInfo {
      margin-bottom: 10px;
      font-size: 12px;
    }
    .editor-header.is-fixed .toolbar-row {
      margin-bottom: 0;
    }
    .editor-header.is-fixed .side-label {
      font-size: 18px;
    }

    .title-wrap {
      position: relative;
      margin-bottom: 10px;
    }
    #title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
    }
    .side-label {
      position: absolute;
      right: calc(100% + 16px);
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      padding-right: 14px;
      border-right: 1px solid #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 400;
      color: #bbb;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .side-label.visible { opacity: 1; }
    @media (max-width: 900px) {
      .side-label { display: none; }
    }
    #metaInfo { font-size: 14px; color: #888; margin-bottom: 20px; min-height: 18px; }
    #metaInfo.no-toolbar, #metaInfo.can-edit-btn { margin-bottom: 28px; }

    /* Строка с панелью инструментов и кнопкой PUBLISH вровень */
    .toolbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      min-height: 34px;
    }
    .toolbar-row.view-mode {
      position: relative;
      height: 0;
      min-height: 0;
      margin: 0;
    }
    .toolbar-row.view-mode .publish-btn {
      position: absolute;
      right: 0;
      bottom: 22px;
    }
    .toolbar-row.hidden {
      display: none;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .tool-sep {
      width: 1px;
      height: 18px;
      background: #e0e0e0;
      margin: 0 2px;
    }
    .tool-btn {
      background: none;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 4px 9px;
      cursor: pointer;
      color: #555;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
    }
    .tool-btn:hover { border-color: #222; color: #222; }

    /* Палитра цветов текста */
    .color-wrap {
      position: relative;
      display: inline-flex;
    }
    .color-btn-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      font-weight: 700;
      font-size: 13px;
    }
    .color-bar {
      width: 13px;
      height: 2.5px;
      background-image: linear-gradient(90deg, #ff3b30, #ff9500, #ffcc00, #34c759, #007aff, #af52de);
      margin-top: 2px;
      border-radius: 1px;
    }
    .color-popover {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 95;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 7px 8px;
      gap: 6px;
      align-items: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }
    .color-popover.open {
      display: flex;
    }
    .color-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.15);
      cursor: pointer;
      padding: 0;
      transition: transform 0.12s ease;
    }
    .color-swatch:hover {
      transform: scale(1.18);
    }

    #story {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 18px;
      line-height: 1.58;
      min-height: 350px;
    }
    #story p, #story div { margin: 0; line-height: 1.58; }
    #story h3 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      margin: 18px 0 8px;
    }
    #story blockquote { margin: 12px 0; padding-left: 16px; border-left: 3px solid #222; }
    #story ul { margin: 12px 0; padding-left: 24px; }
    #story li {
      margin: 0 0 13px;
      padding-left: 6px;
      line-height: 1.55;
    }
    #story li:last-child { margin-bottom: 0; }
    #story img { max-width: 100%; height: auto; display: block; margin: 18px 0; border-radius: 4px; }
    #story a { color: #0066cc; text-decoration: underline; cursor: pointer; }

    .status { font-size: 13px; color: #888; margin-top: 10px; font-weight: 500; min-height: 18px; }
    .status.error { color: #d9534f; }
    .status.ok { color: #28a745; }
    .auth-bar { margin-top: 40px; font-size: 12px; color: #aaa; }
    .auth-bar button { background: none; border: 0; padding: 0; font: inherit; color: #aaa; cursor: pointer; text-decoration: underline; }
    .auth-bar button:hover { color: #222; }

    /* Список /blog */
    .blog-search {
      width: 100%; box-sizing: border-box; padding: 9px 14px; margin: 10px 0 15px;
      border: 1px solid #ddd; border-radius: 20px; font-size: 14px; outline: none;
    }
    .blog-search:focus { border-color: #222; }
    .posts-list { list-style: none; padding: 0; margin: 0; }
    .post-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid #eee; gap: 15px;
    }
    .post-info a { font-family: Georgia, serif; font-size: 20px; font-weight: 700; color: #222; text-decoration: none; }
    .post-info a:hover { color: #0066cc; }
    .post-meta { font-size: 12px; color: #888; margin-top: 4px; }
    .post-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .mini-btn {
      background: #fff; border: 1px solid #ddd; border-radius: 15px;
      padding: 5px 11px; font-size: 12px; cursor: pointer; color: #333;
      white-space: nowrap;
    }
    .mini-btn:hover { border-color: #222; }
    .mini-btn.del:hover { border-color: #d9534f; color: #d9534f; }

    /* Всплывающая плашка ввода ссылки */
    .link-popover {
      display: none;
      position: absolute;
      z-index: 90;
      background: #262626;
      border-radius: 8px;
      padding: 10px 14px;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }
    .link-popover input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      width: 280px;
      font-family: inherit;
    }
    .link-popover input::placeholder { color: #888; }
    .link-popover button {
      background: none;
      border: none;
      color: #999;
      font-size: 19px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .link-popover button:hover { color: #fff; }

    /* Модальное окно входа/регистрации */
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      justify-content: center; align-items: center; z-index: 100;
    }
    .modal-box {
      background: #fff; padding: 24px; border-radius: 12px; width: 100%; max-width: 310px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .modal-box h3 { margin: 0 0 14px; font-size: 18px; }
    .modal-box input {
      width: 100%; box-sizing: border-box; padding: 9px 12px; margin-bottom: 10px;
      border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none;
    }
    .modal-box input:focus { border-color: #222; }
    .modal-btns { display: flex; gap: 8px; margin-top: 4px; }
    .modal-btns button {
      flex: 1; padding: 9px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
    }
    .btn-primary { background: #222; color: #fff; border: none; }
    .btn-secondary { background: #fff; color: #222; border: 1px solid #222; }
    .modal-close { display: block; width: 100%; margin-top: 10px; background: none; border: none; color: #999; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <div id="headerSpacer" style="display:none;"></div>
    <div id="editorHeader" class="editor-header is-editing">
      <div class="editor-header-inner">
        <div class="top-bar">
          <div class="top-left">
            <a href="/" class="new-link">+ Новая запись</a>
            <a href="/blog" id="adminBlogLink" class="new-link">Блог</a>
          </div>
        </div>

        <div class="title-wrap">
          <span id="titleSideLabel" class="side-label">Title</span>
          <div id="title" class="editable" contenteditable="true" data-placeholder="Title"></div>
        </div>
        <div id="metaInfo" class="editable" data-placeholder="Author"></div>

        <div id="toolbarRow" class="toolbar-row">
          <div id="toolbar" class="toolbar">
            <button class="tool-btn" type="button" data-cmd="bold" title="Жирный">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
            </button>
            <button class="tool-btn" type="button" data-cmd="italic" title="Курсив">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
            </button>
            <button class="tool-btn" type="button" data-cmd="strikeThrough" title="Зачёркнутый">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
            </button>
            <div class="color-wrap" id="colorWrap">
              <button class="tool-btn" type="button" id="colorBtn" title="Цвет текста">
                <span class="color-btn-inner">
                  <span>A</span>
                  <span class="color-bar" id="colorBar"></span>
                </span>
              </button>
              <div class="color-popover" id="colorPopover">
                <button type="button" class="color-swatch" data-color="#222222" style="background:#222222;" title="Чёрный (по умолчанию)"></button>
                <button type="button" class="color-swatch" data-color="#d93025" style="background:#d93025;" title="Красный"></button>
                <button type="button" class="color-swatch" data-color="#e37400" style="background:#e37400;" title="Оранжевый"></button>
                <button type="button" class="color-swatch" data-color="#d4a017" style="background:#d4a017;" title="Жёлтый"></button>
                <button type="button" class="color-swatch" data-color="#1e8e3e" style="background:#1e8e3e;" title="Зелёный"></button>
                <button type="button" class="color-swatch" data-color="#1a73e8" style="background:#1a73e8;" title="Синий"></button>
                <button type="button" class="color-swatch" data-color="#9334e6" style="background:#9334e6;" title="Пурпурный"></button>
              </div>
            </div>
            <button class="tool-btn" type="button" data-cmd="formatBlock" data-arg="H3" title="Подзаголовок">H</button>
            <button class="tool-btn" type="button" data-cmd="formatBlock" data-arg="BLOCKQUOTE" title="Цитата">”</button>
            <button class="tool-btn" type="button" data-cmd="insertUnorderedList" title="Список">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
            <span class="tool-sep"></span>
            <button class="tool-btn" type="button" data-cmd="justifyCenter" title="По центру">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="6"/><line x1="21" y1="12" x2="3" y2="12"/><line x1="18" y1="18" x2="6" y2="18"/></svg>
            </button>
            <button class="tool-btn" type="button" data-cmd="justifyRight" title="По правому краю">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="12" x2="9" y2="12"/><line x1="21" y1="18" x2="3" y2="18"/></svg>
            </button>
            <span class="tool-sep"></span>
            <button id="linkBtn" class="tool-btn" type="button">🔗 Ссылка</button>
            <button id="photoBtn" class="tool-btn" type="button">📷 Фото</button>
            <input type="file" id="fileInput" accept="image/*" style="display:none">
          </div>
          <button id="actionBtn" class="publish-btn" type="button" disabled>PUBLISH</button>
        </div>
      </div>
    </div>

    <div id="story" class="editable" contenteditable="true" data-placeholder="Your story... (можно вставлять фото через Ctrl+V)"></div>
    <div id="status" class="status"></div>

    <div class="auth-bar">
      <button id="authBtn" type="button">Войти</button>
    </div>
  </div>

  <!-- Всплывающее поле ввода ссылки -->
  <div id="linkPopover" class="link-popover">
    <input type="text" id="linkUrlInput" placeholder="Paste or type a link...">
    <button type="button" id="closeLinkPopover" title="Закрыть">✕</button>
  </div>

  <!-- Окно входа и регистрации -->
  <div id="authModal" class="modal-bg">
    <div class="modal-box">
      <h3 id="modalTitle">Вход</h3>
      <form id="authForm">
        <input type="text" id="loginInput" name="username" autocomplete="username" placeholder="Логин (латиницей)">
        <input type="password" id="passInput" name="password" autocomplete="current-password" placeholder="Пароль">
        <div id="modalMsg" style="font-size:12px; color:#d9534f; margin-bottom:8px; min-height:16px;"></div>
        <div class="modal-btns">
          <button id="submitAuthBtn" class="btn-primary" type="submit">Войти</button>
        </div>
      </form>
      <div style="text-align:center; margin-top:12px; font-size:12px; color:#777;">
        <span id="switchHint">Нет аккаунта?</span>
        <button id="switchModeBtn" type="button" style="background:none; border:none; color:#222; font-weight:600; cursor:pointer; text-decoration:underline; padding:0; font-size:12px;">Регистрация</button>
      </div>
      <button id="closeModalBtn" class="modal-close" type="button">Закрыть</button>
    </div>
  </div>

  <script src="/firebase-app-compat.js"></script>
  <script src="/firebase-auth-compat.js"></script>
  <script src="/firebase-firestore-compat.js"></script>
  <script>
    const ADMIN_LOGIN = 'lordman';
    const DEFAULT_RAINBOW = 'linear-gradient(90deg, #ff3b30, #ff9500, #ffcc00, #34c759, #007aff, #af52de)';

    const editorHeader = document.getElementById('editorHeader');
    const headerSpacer = document.getElementById('headerSpacer');
    const toolbarRow = document.getElementById('toolbarRow');
    const titleEl = document.getElementById('title');
    const titleSideLabel = document.getElementById('titleSideLabel');
    const metaInfoEl = document.getElementById('metaInfo');
    const storyEl = document.getElementById('story');
    const actionBtn = document.getElementById('actionBtn');
    const photoBtn = document.getElementById('photoBtn');
    const linkBtn = document.getElementById('linkBtn');
    const linkPopover = document.getElementById('linkPopover');
    const linkUrlInput = document.getElementById('linkUrlInput');
    const closeLinkPopover = document.getElementById('closeLinkPopover');
    const colorWrap = document.getElementById('colorWrap');
    const colorBtn = document.getElementById('colorBtn');
    const colorBar = document.getElementById('colorBar');
    const colorPopover = document.getElementById('colorPopover');
    const fileInput = document.getElementById('fileInput');
    const toolbar = document.getElementById('toolbar');
    const statusEl = document.getElementById('status');
    const authBtn = document.getElementById('authBtn');
    const adminBlogLink = document.getElementById('adminBlogLink');
    const authModal = document.getElementById('authModal');
    const loginInput = document.getElementById('loginInput');
    const passInput = document.getElementById('passInput');

    let currentUser = null;
    let currentArticleOwner = null;
    let savedLinkRange = null;
    const pathSlug = window.location.pathname.replace(/^\/+|\/+$/g, '');
    let currentSlug = pathSlug;
    let isViewMode = false;

    let initialSnapshot = { title: '', story: '', meta: '' };

    function getCurrentSnapshot() {
      return {
        title: titleEl.innerHTML,
        story: storyEl.innerHTML,
        meta: metaInfoEl.innerText.trim()
      };
    }

    function captureInitialSnapshot() {
      initialSnapshot = getCurrentSnapshot();
      updatePublishState();
    }

    function hasUnsavedChanges() {
      const cur = getCurrentSnapshot();
      if (cur.title !== initialSnapshot.title) return true;
      if (cur.story !== initialSnapshot.story) return true;
      if (currentUser && isAdmin(currentUser) && cur.meta !== initialSnapshot.meta) return true;
      return false;
    }

    function updatePublishState() {
      if (isViewMode) {
        actionBtn.disabled = false;
        return;
      }
      actionBtn.disabled = !hasUnsavedChanges();
    }

    captureInitialSnapshot();

    function updateFixedHeader() {
      if (!editorHeader.classList.contains('is-editing')) {
        editorHeader.classList.remove('is-fixed');
        headerSpacer.style.display = 'none';
        return;
      }
      const triggerY = 28;
      if (window.scrollY > triggerY) {
        if (!editorHeader.classList.contains('is-fixed')) {
          headerSpacer.style.height = editorHeader.offsetHeight + 'px';
          headerSpacer.style.display = 'block';
          editorHeader.classList.add('is-fixed');
        }
      } else {
        editorHeader.classList.remove('is-fixed');
        headerSpacer.style.display = 'none';
      }
    }
    window.addEventListener('scroll', updateFixedHeader, { passive: true });
    window.addEventListener('resize', () => {
      if (editorHeader.classList.contains('is-fixed')) {
        editorHeader.classList.remove('is-fixed');
        headerSpacer.style.height = editorHeader.offsetHeight + 'px';
        editorHeader.classList.add('is-fixed');
      }
    });

    function updateTitleSideLabel() {
      const hasText = titleEl.innerText.trim().length > 0;
      if (!hasText && titleEl.innerHTML !== '') {
        titleEl.innerHTML = '';
      }
      const canEdit = titleEl.isContentEditable;
      titleSideLabel.classList.toggle('visible', hasText && canEdit);
    }
    titleEl.addEventListener('input', () => {
      updateTitleSideLabel();
      updatePublishState();
    });
    metaInfoEl.addEventListener('input', updatePublishState);

    function renderMeta(login, timestamp) {
      const parts = [];
      if (login) parts.push(login);
      if (timestamp) {
        const dateStr = new Date(timestamp).toLocaleString('ru-RU', {
          day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        parts.push(dateStr);
      }
      metaInfoEl.textContent = parts.join(' • ');
    }

    function setStatus(text, kind) {
      statusEl.textContent = text || '';
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    function getLoginName(user) {
      return user && user.email ? user.email.split('@')[0] : '';
    }

    function isAdmin(user) {
      return getLoginName(user) === ADMIN_LOGIN;
    }

    function placeCaretAtEnd(el) {
      if (!el) return;
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function compressAndInsertImage(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = event => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 850;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
            height = Math.round(height * MAX_WIDTH / width);
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          storyEl.focus();
          document.execCommand('insertHTML', false, `<img src="${dataUrl}"><br>`);
          updatePublishState();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

      try {

        if (snap.empty) {
          setStatus(adminMode ? 'Пока нет ни одной статьи.' : 'Здесь пока пусто — вы ещё ничего не опубликовали.');
          return;
        }

        const posts = [];
        snap.forEach(doc => posts.push({ id: doc.id, ...doc.data() }));
        posts.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

        const searchInput = document.createElement('input');
        searchInput.type = 'text';
        searchInput.className = 'blog-search';
        searchInput.placeholder = adminMode
          ? 'Поиск по заголовку, ссылке или логину автора...'
          : 'Поиск по вашим публикациям...';

        const ul = document.createElement('ul');
        ul.className = 'posts-list';

        function renderList(filterText = '') {
          ul.innerHTML = '';
          const q = filterText.toLowerCase().trim();
          let count = 0;

          posts.forEach(post => {
            const temp = document.createElement('div');
            temp.innerHTML = post.title || post.id;
            const cleanTitle = temp.innerText.trim() || post.id;
            const ownerName = Array.isArray(post.ownerLogin) ? post.ownerLogin[0] : (post.ownerLogin || 'неизвестен (старая запись)');

            if (q && !cleanTitle.toLowerCase().includes(q) && !post.id.toLowerCase().includes(q) && !(adminMode && ownerName.toLowerCase().includes(q))) {
              return;
            }
            count++;

            const dateStr = post.updatedAt ? new Date(post.updatedAt).toLocaleString('ru-RU', {
              day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
            }) : '—';
            const fullUrl = `${window.location.origin}/${post.id}`;
            const authorPart = adminMode ? ` • Автор: <b>${ownerName}</b>` : '';

            const li = document.createElement('li');
            li.className = 'post-item';
            li.innerHTML = `
              <div class="post-info">
                <a href="/${post.id}">${cleanTitle}</a>
                <div class="post-meta">/${post.id}${authorPart} • Изменено: ${dateStr}</div>
              </div>
              <div class="post-actions">
                <button class="mini-btn copy-btn" type="button">Копировать ссылку</button>
                <button class="mini-btn del del-btn" type="button">Удалить</button>
              </div>
            `;

            li.querySelector('.copy-btn').addEventListener('click', (e) => {
              navigator.clipboard?.writeText(fullUrl);
              e.target.textContent = 'Скопировано!';
              setTimeout(() => e.target.textContent = 'Копировать ссылку', 1500);
            });

            li.querySelector('.del-btn').addEventListener('click', async () => {
              if (!confirm(`Точно удалить статью «${cleanTitle}» (/${post.id})?`)) return;
              try {
                await db.collection('articles').doc(post.id).delete();
                const idx = posts.indexOf(post);
                if (idx > -1) posts.splice(idx, 1);
                if (posts.length === 0) {
                  searchInput.remove();
                  ul.remove();
                  setStatus('Здесь пока пусто — вы ещё ничего не опубликовали.');
                } else {
                  renderList(searchInput.value);
                }
              } catch (err) {
                alert('Ошибка удаления: ' + err.message);
              }
            });

            ul.appendChild(li);
          });

          setStatus(`Показано статей: ${count} из ${posts.length}`);
        }

        searchInput.addEventListener('input', () => renderList(searchInput.value));
        storyEl.after(searchInput, ul);
        renderList();
      } catch (e) {
        setStatus('Ошибка загрузки списка: ' + e.message, 'error');

    function slugify(text) {
      const map = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
      return text.toLowerCase().split('').map(c => map[c] || c).join('')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'post-' + Date.now();
    }

    actionBtn.addEventListener('click', async () => {
      if (!db || !auth) return;

      if (!currentUser) {
        setAuthMode(false);
        authModal.style.display = 'flex';
        loginInput.focus();
        return;
      }

      if (isViewMode) {
        isViewMode = false;
        setEditable(true);
        actionBtn.textContent = 'PUBLISH';
        captureInitialSnapshot();
        return;
      }

      if (!hasUnsavedChanges()) return;

      const titleText = titleEl.innerText.trim();
      if (!titleText) {
        alert('Введите заголовок (Title)!');
        return;
      }

      actionBtn.disabled = true;
      actionBtn.classList.add('is-saving');
      setStatus('Публикация...');

      try {
        let targetSlug = currentSlug;
        if (!targetSlug) {
          let baseSlug = slugify(titleText);
          targetSlug = baseSlug;
          let counter = 1;
          while ((await db.collection('articles').doc(targetSlug).get()).exists) {
            targetSlug = `${baseSlug}${counter++}`;
          }
        }

        const now = Date.now();
        const payload = {
          title: titleEl.innerHTML,
          story: storyEl.innerHTML,
          updatedAt: now
        };

        if (isAdmin(currentUser)) {
          payload.customMeta = metaInfoEl.innerText.trim();
        } else {
          payload.customMeta = firebase.firestore.FieldValue.delete();
        }

        if (!currentArticleOwner) {
          payload.ownerUid = currentUser.uid;
          payload.ownerLogin = getLoginName(currentUser);
          currentArticleOwner = currentUser.uid;
        }

        await db.collection('articles').doc(targetSlug).set(payload, { merge: true });

        if (isAdmin(currentUser)) {
          metaInfoEl.textContent = payload.customMeta;
        } else {
          renderMeta(payload.ownerLogin || getLoginName(currentUser), now);
        }

        currentSlug = targetSlug;
        window.history.pushState({}, '', '/' + targetSlug);
        document.title = titleText;
        isViewMode = true;
        captureInitialSnapshot();
        setEditable(false);
        actionBtn.textContent = 'EDIT';
        updateEditVisibility();
        setStatus('Опубликовано! Ссылка скопирована в буфер.', 'ok');
        navigator.clipboard?.writeText(window.location.href);
      } catch (e) {
        setStatus('Ошибка публикации: ' + e.message, 'error');
      } finally {
        actionBtn.classList.remove('is-saving');
        updatePublishState();
      }
    });
  </script>
</body>
</html>
