    (async function init() {
      const savedPath = sessionStorage.getItem("__gh_path");
      if (savedPath) {
        sessionStorage.removeItem("__gh_path");
        history.replaceState(null, "", savedPath);
      }
      const path = window.location.pathname.replace(/\/+$/, "") || "/";

      if (redirects[path]) {
        let country = "Unknown";
        try {
          const res = await fetch("https://ipapi.co/json/", { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data && data.country_code) country = data.country_code;
          }
        } catch (_) {}

        if (country !== "RU") {
          renderVpn(path, country);
          return;
        }
        window.location.replace(redirects[path]);
        return;
      }

      if (path === "/") renderHome();
      else if (path === "/mfo") renderMfo();
      else renderHome();
    })();
  </script>
</body>
</html>
