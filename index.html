<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Telegraph</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      color: #222;
      background: #fff;
    }
    .container {
      max-width: 730px;
      margin: 0 auto;
      position: relative;
    }
    .publish-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: #fff;
      border: 2px solid #222;
      border-radius: 20px;
      padding: 6px 18px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.2s;
    }
    .publish-btn:hover {
      background: #222;
      color: #fff;
    }
    .editable {
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }
    /* Плейсхолдеры для пустых блоков */
    .editable:empty:before {
      content: attr(data-placeholder);
      color: #999;
      pointer-events: none;
      display: block;
    }
    #title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      padding-right: 120px; /* место под кнопку */
    }
    #author {
      font-size: 15px;
      color: #777;
      margin-bottom: 24px;
    }
    #story {
      font-size: 18px;
      line-height: 1.6;
      min-height: 300px;
    }
    .toolbar {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }
    .tool-btn {
      background: none;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      color: #555;
      font-size: 14px;
    }
    .tool-btn:hover {
      border-color: #222;
      color: #222;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="publish-btn" onclick="publishPage()">PUBLISH</button>

    <div id="title" class="editable" contenteditable="true" data-placeholder="Title"></div>
    <div id="author" class="editable" contenteditable="true" data-placeholder="Your name"></div>

    <div class="toolbar">
      <button class="tool-btn" onclick="format('bold')" title="Жирный"><b>B</b></button>
      <button class="tool-btn" onclick="format('italic')" title="Курсив"><i>I</i></button>
      <button class="tool-btn" onclick="addImage()" title="Вставить фото по ссылке">📷</button>
      <button class="tool-btn" onclick="addEmbed()" title="Вставить код">&lt; &gt;</button>
    </div>

    <div id="story" class="editable" contenteditable="true" data-placeholder="Your story..."></div>
  </div>

  <script>
    const fields = ['title', 'author', 'story'];

    // Загрузка сохранённого черновика при открытии
    fields.forEach(id => {
      const el = document.getElementById(id);
      el.innerHTML = localStorage.getItem('draft_' + id) || '';
      el.addEventListener('input', () => {
        localStorage.setItem('draft_' + id, el.innerHTML);
      });
    });

    function format(cmd) {
      document.execCommand(cmd, false, null);
    }

    function addImage() {
      const url = prompt('Вставьте ссылку на изображение:');
      if (url) {
        document.execCommand('insertHTML', false, `<img src="${url}" style="max-width:100%; margin: 15px 0; border-radius: 4px;"><br>`);
      }
    }

    function addEmbed() {
      const code = prompt('Вставьте HTML-код (например, iframe видео):');
      if (code) {
        document.execCommand('insertHTML', false, code + '<br>');
      }
    }

    function publishPage() {
      const isEditing = document.getElementById('story').isContentEditable;
      const btn = document.querySelector('.publish-btn');
      
      fields.forEach(id => {
        document.getElementById(id).contentEditable = !isEditing;
      });
      
      document.querySelector('.toolbar').style.display = isEditing ? 'none' : 'flex';
      btn.textContent = isEditing ? 'EDIT' : 'PUBLISH';
      alert(isEditing ? 'Режим просмотра включён!' : 'Режим редактирования!');
    }
  </script>

</body>
</html>
