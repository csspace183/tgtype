<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tgtype</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      color: #222;
      background: #fff;
    }
    .container {
      max-width: 730px;
      margin: 0 auto;
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .new-link {
      font-size: 13px;
      color: #999;
      text-decoration: none;
    }
    .new-link:hover { color: #222; }
    .publish-btn {
      background: #fff;
      border: 2px solid #222;
      border-radius: 20px;
      padding: 6px 18px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.2s;
    }
    .publish-btn:hover { background: #222; color: #fff; }
    .publish-btn:disabled { opacity: 0.5; cursor: wait; }
    .editable {
      outline: none;
      width: 100%;
      box-sizing: border-box;
      word-wrap: break-word;
    }
    .editable:empty:before {
      content: attr(data-placeholder);
      color: #999;
      pointer-events: none;
      display: block;
    }
    #title {
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    #author {
      font-size: 15px;
      color: #777;
      margin-bottom: 24px;
    }
    #story {
      font-family: Georgia, serif;
      font-size: 19px;
      line-height: 1.65;
      min-height: 350px;
    }
    #story img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 18px 0;
      border-radius: 4px;
    }
    .toolbar {
      margin-bottom: 15px;
      display: flex;
      gap: 8px;
    }
    .tool-btn {
      background: none;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 4px 9px;
      cursor: pointer;
      color: #555;
      font-size: 13px;
    }
    .tool-btn:hover { border-color: #222; color: #222; }
    .status {
      font-size: 13px;
      color: #d9534f;
      margin-top: 10px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <a href="/" class="new-link">+ Новая страница</a>
      <button id="actionBtn" class="publish-btn" type="button">PUBLISH</button>
    </div>

    <div id="title" class="editable" contenteditable="true" data-placeholder="Title"></div>
    <div id="author" class="editable" contenteditable="true" data-placeholder="Your name"></div>

    <div id="toolbar" class="toolbar">
      <button class="tool-btn" type="button" onclick="document.execCommand('bold')"><b>B</b></button>
      <button class="tool-btn" type="button" onclick="document.execCommand('italic')"><i>I</i></button>
      <button class="tool-btn" type="button" onclick="document.execCommand('formatBlock', false, 'H3')">H</button>
      <button class="tool-btn" type="button" onclick="document.execCommand('formatBlock', false, 'BLOCKQUOTE')">”</button>
      <button id="photoBtn" class="tool-btn" type="button">📷 Фото</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <div id="story" class="editable" contenteditable="true" data-placeholder="Your story... (можно вставлять фото через Ctrl+V)"></div>
    <div id="status" class="status"></div>
  </div>

  <!-- Подключаем Firebase через стабильный CDN jsDelivr -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>

  <script>
    const titleEl = document.getElementById('title');
    const authorEl = document.getElementById('author');
    const storyEl = document.getElementById('story');
    const actionBtn = document.getElementById('actionBtn');
    const photoBtn = document.getElementById('photoBtn');
    const fileInput = document.getElementById('fileInput');
    const toolbar = document.getElementById('toolbar');
    const statusEl = document.getElementById('status');

    // Работа с фото (работает независимо от базы данных)
    photoBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        compressAndInsertImage(e.target.files[0]);
      }
    });

    storyEl.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf('image') === 0) {
          e.preventDefault();
          const file = item.getAsFile();
          compressAndInsertImage(file);
        }
      }
    });

    function compressAndInsertImage(file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 900;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          storyEl.focus();
          document.execCommand('insertHTML', false, `<img src="${dataUrl}"><br>`);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Инициализация базы данных Firebase
    let db = null;
    if (typeof firebase !== 'undefined') {
      const firebaseConfig = {
        apiKey: "AIzaSyAGZvMxxAZEsbech1evNe2aNwR6GfC0xhw",
        authDomain: "://firebaseapp.com",
        projectId: "tgtype-a41aa",
        storageBucket: "tgtype-a41aa.firebasestorage.app",
        messagingSenderId: "967552866716",
        appId: "1:967552866716:web:2d3dff00a96e83e151d059",
        measurementId: "G-ZQ5XB5MD7V"
      };
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } else {
      statusEl.textContent = 'Ошибка: скрипт Firebase не загрузился (проверьте интернет или VPN).';
    }

    const pathSlug = window.location.pathname.replace(/^\/+|\/+$/g, '');
    let currentSlug = pathSlug;
    let isViewMode = false;

    if (pathSlug && db) {
      loadArticle(pathSlug);
    }

    async function loadArticle(slug) {
      setEditable(false);
      statusEl.style.color = '#888';
      statusEl.textContent = 'Загрузка...';
      try {
        const snap = await db.collection('articles').doc(slug).get();
        if (snap.exists) {
          const data = snap.data();
          titleEl.innerHTML = data.title;
          authorEl.innerHTML = data.author;
          storyEl.innerHTML = data.story;
          document.title = titleEl.innerText || 'tgtype';
          statusEl.textContent = '';
          actionBtn.textContent = 'EDIT';
          isViewMode = true;
        } else {
          statusEl.textContent = 'Страница не найдена. Можете создать её здесь!';
          setEditable(true);
        }
      } catch (e) {
        statusEl.style.color = '#d9534f';
        statusEl.textContent = 'Ошибка загрузки: ' + e.message;
      }
    }

    function setEditable(canEdit) {
      titleEl.contentEditable = canEdit;
      authorEl.contentEditable = canEdit;
      storyEl.contentEditable = canEdit;
      toolbar.style.display = canEdit ? 'flex' : 'none';
    }

    function slugify(text) {
      const map = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
      return text.toLowerCase().split('').map(c => map[c] || c).join('')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'post-' + Date.now();
    }

    function getSecret() {
      let pass = localStorage.getItem('tgtype_secret');
      if (!pass) {
        pass = prompt('Введите ваш секретный пароль автора:');
        if (pass) localStorage.setItem('tgtype_secret', pass);
      }
      return pass;
    }

    actionBtn.addEventListener('click', async () => {
      if (!db) {
        alert('База данных не подключена! Обновите страницу или проверьте соединение.');
        return;
      }

      if (isViewMode) {
        const pass = getSecret();
        if (!pass) return;
        isViewMode = false;
        setEditable(true);
        actionBtn.textContent = 'PUBLISH';
        return;
      }

      const secret = getSecret();
      if (!secret) return;

      const titleText = titleEl.innerText.trim();
      if (!titleText) {
        alert('Введите заголовок (Title)!');
        return;
      }

      actionBtn.disabled = true;
      statusEl.style.color = '#888';
      statusEl.textContent = 'Публикация...';

      try {
        let targetSlug = currentSlug;

        if (!targetSlug) {
          let baseSlug = slugify(titleText);
          targetSlug = baseSlug;
          let counter = 2;
          while ((await db.collection('articles').doc(targetSlug).get()).exists) {
            targetSlug = `${baseSlug}-${counter++}`;
          }
        }

        await db.collection('articles').doc(targetSlug).set({
          title: titleEl.innerHTML,
          author: authorEl.innerHTML,
          story: storyEl.innerHTML,
          secret: secret,
          updatedAt: Date.now()
        });
        document.title = titleText;
isViewMode = true;
setEditable(false);
actionBtn.textContent = 'EDIT';
statusEl.style.color = '#28a745';
statusEl.textContent = 'Опубликовано! Ссылка скопирована в буфер обмена.';
navigator.clipboard?.writeText(window.location.href);
} catch (e) {
localStorage.removeItem('tgtype_secret');
statusEl.style.color = '#d9534f';
statusEl.textContent = 'Ошибка: ' + e.message;
alert('Ошибка публикации: неверный пароль в Rules Firebase или превышен размер фото.');
} finally {
actionBtn.disabled = false;
}
});

        currentSlug = targetSlug;
        window.history.pushState({}, '', '/' + targetSlug);
