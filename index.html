<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tgtype</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px 80px;
      color: #222;
      background: #fff;
    }
    .container { max-width: 730px; margin: 0 auto; position: relative; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 36px;
      margin-bottom: 20px;
    }
    .top-left { display: flex; align-items: center; gap: 16px; }
    .new-link { font-size: 13px; color: #999; text-decoration: none; }
    .new-link:hover { color: #222; }
    .publish-btn {
      background: #fff;
      border: 2px solid #222;
      border-radius: 20px;
      padding: 6px 18px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.2s;
    }
    .publish-btn:hover { background: #222; color: #fff; }
    .publish-btn:disabled { opacity: 0.5; cursor: wait; }
    .editable { outline: none; width: 100%; box-sizing: border-box; word-wrap: break-word; }
    .editable:empty:before {
      content: attr(data-placeholder);
      color: #999;
      pointer-events: none;
      display: block;
    }
    #title { font-family: Georgia, serif; font-size: 34px; font-weight: 700; margin-bottom: 8px; }
    #metaInfo { font-size: 14px; color: #888; margin-bottom: 24px; min-height: 18px; }
    #story {
      font-family: Georgia, serif;
      font-size: 19px;
      line-height: 1.65;
      min-height: 350px;
    }
    #story p { margin: 0 0 1em; }
    #story h3 { font-size: 24px; margin: 1.3em 0 .5em; }
    #story blockquote { margin: 1em 0; padding-left: 16px; border-left: 3px solid #222; }
    #story img { max-width: 100%; height: auto; display: block; margin: 18px 0; border-radius: 4px; }
    #story a { color: #0066cc; text-decoration: underline; cursor: pointer; }
    .toolbar { margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; }
    .tool-btn {
      background: none;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 4px 9px;
      cursor: pointer;
      color: #555;
      font-size: 13px;
    }
    .tool-btn:hover { border-color: #222; color: #222; }
    .status { font-size: 13px; color: #888; margin-top: 10px; font-weight: 500; min-height: 18px; }
    .status.error { color: #d9534f; }
    .status.ok { color: #28a745; }
    .auth-bar { margin-top: 40px; font-size: 12px; color: #aaa; }
    .auth-bar button { background: none; border: 0; padding: 0; font: inherit; color: #aaa; cursor: pointer; text-decoration: underline; }
    .auth-bar button:hover { color: #222; }

    /* Админ-список /blog */
    .blog-search {
      width: 100%; box-sizing: border-box; padding: 9px 14px; margin: 10px 0 15px;
      border: 1px solid #ddd; border-radius: 20px; font-size: 14px; outline: none;
    }
    .blog-search:focus { border-color: #222; }
    .posts-list { list-style: none; padding: 0; margin: 0; }
    .post-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid #eee; gap: 15px;
    }
    .post-info a { font-family: Georgia, serif; font-size: 20px; font-weight: 700; color: #222; text-decoration: none; }
    .post-info a:hover { color: #0066cc; }
    .post-meta { font-size: 12px; color: #888; margin-top: 4px; }
    .post-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .mini-btn {
      background: #fff; border: 1px solid #ddd; border-radius: 15px;
      padding: 5px 11px; font-size: 12px; cursor: pointer; color: #333;
    }
    .mini-btn:hover { border-color: #222; }
    .mini-btn.del:hover { border-color: #d9534f; color: #d9534f; }

    /* Модальное окно входа/регистрации */
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      justify-content: center; align-items: center; z-index: 100;
    }
    .modal-box {
      background: #fff; padding: 24px; border-radius: 12px; width: 100%; max-width: 310px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .modal-box h3 { margin: 0 0 14px; font-size: 18px; }
    .modal-box input {
      width: 100%; box-sizing: border-box; padding: 9px 12px; margin-bottom: 10px;
      border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none;
    }
    .modal-box input:focus { border-color: #222; }
    .modal-btns { display: flex; gap: 8px; margin-top: 4px; }
    .modal-btns button {
      flex: 1; padding: 9px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
    }
    .btn-primary { background: #222; color: #fff; border: none; }
    .btn-secondary { background: #fff; color: #222; border: 1px solid #222; }
    .modal-close { display: block; width: 100%; margin-top: 10px; background: none; border: none; color: #999; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div class="top-left">
        <a href="/" class="new-link">+ Новая запись</a>
        <a href="/blog" id="adminBlogLink" class="new-link">Блог</a>
      </div>
      <button id="actionBtn" class="publish-btn" type="button">PUBLISH</button>
    </div>

    <div id="title" class="editable" contenteditable="true" data-placeholder="Title"></div>
    <div id="metaInfo"></div>

    <div id="toolbar" class="toolbar">
      <button class="tool-btn" type="button" data-cmd="bold"><b>B</b></button>
      <button class="tool-btn" type="button" data-cmd="italic"><i>I</i></button>
      <button class="tool-btn" type="button" data-cmd="formatBlock" data-arg="H3">H</button>
      <button class="tool-btn" type="button" data-cmd="formatBlock" data-arg="BLOCKQUOTE">”</button>
      <button id="linkBtn" class="tool-btn" type="button">🔗 Ссылка</button>
      <button id="photoBtn" class="tool-btn" type="button">📷 Фото</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <div id="story" class="editable" contenteditable="true" data-placeholder="Your story... (можно вставлять фото через Ctrl+V)"></div>
    <div id="status" class="status"></div>

    <div class="auth-bar">
      <button id="authBtn" type="button">Войти</button>
    </div>
  </div>

  <!-- Окно входа и регистрации -->
  <div id="authModal" class="modal-bg">
    <div class="modal-box">
      <h3>Вход / Регистрация</h3>
      <input type="text" id="loginInput" placeholder="Логин (латиницей, например admin)">
      <input type="password" id="passInput" placeholder="Пароль (минимум 6 символов)">
      <div class="modal-btns">
        <button id="doLoginBtn" class="btn-primary" type="button">Войти</button>
        <button id="doRegBtn" class="btn-secondary" type="button">Регистрация</button>
      </div>
      <button id="closeModalBtn" class="modal-close" type="button">Закрыть</button>
    </div>
  </div>

  <script src="/firebase-app-compat.js"></script>
  <script src="/firebase-auth-compat.js"></script>
  <script src="/firebase-firestore-compat.js"></script>
  <script>
    const ADMIN_LOGIN = 'lordman';

    const titleEl = document.getElementById('title');
    const metaInfoEl = document.getElementById('metaInfo');
    const storyEl = document.getElementById('story');
    const actionBtn = document.getElementById('actionBtn');
    const photoBtn = document.getElementById('photoBtn');
    const linkBtn = document.getElementById('linkBtn');
    const fileInput = document.getElementById('fileInput');
    const toolbar = document.getElementById('toolbar');
    const statusEl = document.getElementById('status');
    const authBtn = document.getElementById('authBtn');
    const adminBlogLink = document.getElementById('adminBlogLink');
    const authModal = document.getElementById('authModal');
    const loginInput = document.getElementById('loginInput');
    const passInput = document.getElementById('passInput');
     let currentUser = null;
    let currentArticleOwner = null;
    const pathSlug = window.location.pathname.replace(/^\/+|\/+$/g, '');
    let currentSlug = pathSlug;
    let isViewMode = false;

    function renderMeta(login, timestamp) {
      const parts = [];
      if (login) parts.push(login);
      if (timestamp) {
        const dateStr = new Date(timestamp).toLocaleString('ru-RU', {
          day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        parts.push(dateStr);
      }
      metaInfoEl.textContent = parts.join(' • ');
    }

    function setStatus(text, kind) {
      statusEl.textContent = text || '';
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    function getLoginName(user) {
      return user && user.email ? user.email.split('@')[0] : '';
    }

    function isAdmin(user) {
      return getLoginName(user) === ADMIN_LOGIN;
    }

    document.querySelectorAll('.tool-btn[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', e => e.preventDefault());
      btn.addEventListener('click', () => {
        storyEl.focus();
        document.execCommand(btn.dataset.cmd, false, btn.dataset.arg || null);
      });
    });

    linkBtn.addEventListener('mousedown', e => e.preventDefault());
    linkBtn.addEventListener('click', () => {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return;

      const anchor = sel.anchorNode?.parentElement?.closest('a') || sel.focusNode?.parentElement?.closest('a');
      if (anchor) {
        if (sel.isCollapsed) {
          const range = document.createRange();
          range.selectNodeContents(anchor);
          sel.removeAllRanges();
          sel.addRange(range);
        }
        document.execCommand('unlink', false, null);
        return;
      }

      if (sel.isCollapsed) {
        alert('Сначала выделите мышкой слово или текст, который нужно сделать ссылкой!');
        return;
      }

      const range = sel.getRangeAt(0);
      let url = prompt('Вставьте ссылку (например, https://google.com):', 'https://');
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      sel.removeAllRanges();
      sel.addRange(range);
      document.execCommand('createLink', false, url);

      const newAnchor = sel.anchorNode?.parentElement?.closest('a') || sel.focusNode?.parentElement?.closest('a');
      if (newAnchor) newAnchor.target = '_blank';
    });

    photoBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      for (const f of e.target.files || []) compressAndInsertImage(f);
      fileInput.value = '';
    });

    storyEl.addEventListener('paste', e => {
      const cd = e.clipboardData || window.clipboardData;
      const items = cd ? cd.items : [];
      for (const item of items) {
        if (item.kind === 'file' && item.type.indexOf('image') === 0) {
          e.preventDefault();
          compressAndInsertImage(item.getAsFile());
          return;
        }
      }
    });

    function compressAndInsertImage(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = event => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 850;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
            height = Math.round(height * MAX_WIDTH / width);
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          storyEl.focus();
          document.execCommand('insertHTML', false, `<img src="${dataUrl}"><br>`);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    let db = null;
    let auth = null;
    if (typeof firebase !== 'undefined') {
      firebase.initializeApp({
        apiKey: "AIzaSyAGZvMxxAZEsbech1evNe2aNwR6GfC0xhw",
        authDomain: "://firebaseapp.com",
        projectId: "tgtype-a41aa",
        storageBucket: "tgtype-a41aa.firebasestorage.app",
        messagingSenderId: "967552866716",
        appId: "1:967552866716:web:2d3dff00a96e83e151d059"
      });
      db = firebase.firestore();
      auth = firebase.auth();
    } else {
      setStatus('Ошибка: файлы Firebase не загрузились.', 'error');
    }

    authBtn.addEventListener('click', () => {
      if (currentUser) {
        auth.signOut();
      } else {
        authModal.style.display = 'flex';
        loginInput.focus();
      }
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      authModal.style.display = 'none';
    });

    function cleanLogin(raw) {
      return raw.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
    }

    document.getElementById('doLoginBtn').addEventListener('click', async () => {
      const login = cleanLogin(loginInput.value);
      const pass = passInput.value;
      if (!login || !pass) return alert('Введите логин и пароль!');
      try {
        await auth.signInWithEmailAndPassword(`${login}@tgtype.local`, pass);
        authModal.style.display = 'none';
        setStatus(`Вход выполнен: ${login}`, 'ok');
      } catch (e) {
        alert('Неверный логин или пароль!');
      }
    });

    document.getElementById('doRegBtn').addEventListener('click', async () => {
      const login = cleanLogin(loginInput.value);
      const pass = passInput.value;
      if (!login || login.length < 3) return alert('Логин: минимум 3 латинских символа (a-z, 0-9)');
      if (!pass || pass.length < 6) return alert('Пароль: минимум 6 символов');
      try {
        await auth.createUserWithEmailAndPassword(`${login}@tgtype.local`, pass);
        authModal.style.display = 'none';
        setStatus(`Аккаунт ${login} зарегистрирован!`, 'ok');
      } catch (e) {
        if (e.code === 'auth/email-already-in-use') {
          alert('Этот логин уже занят! Придумайте другой.');
        } else {
          alert('Ошибка регистрации: ' + e.message);
        }
      }
    });

    let initialLoaded = false;
    if (auth) {
      auth.onAuthStateChanged(user => {
        currentUser = user;
        const login = getLoginName(user);

        if (user) {
          authBtn.textContent = `Выйти (${login})`;
        } else {
          authBtn.textContent = 'Войти';
        }

        updateEditVisibility();

        if (!initialLoaded) {
          initialLoaded = true;
          if (pathSlug === 'blog') {
            loadAdminBlog();
          } else if (pathSlug) {
            loadArticle(pathSlug);
          }
        }
      });
    }

    function updateEditVisibility() {
      if (!isViewMode) {
        actionBtn.style.display = 'inline-block';
        return;
      }
      const canEdit = currentUser && (currentUser.uid === currentArticleOwner || isAdmin(currentUser));
      actionBtn.style.display = canEdit ? 'inline-block' : 'none';
    }

    async function loadAdminBlog() {
      metaInfoEl.style.display = 'none';
      toolbar.style.display = 'none';
      storyEl.style.display = 'none';
      actionBtn.style.display = 'none';
      titleEl.contentEditable = false;

      if (!currentUser || !isAdmin(currentUser)) {
        titleEl.textContent = 'Доступ запрещён';
        document.title = 'Доступ запрещён';
        setStatus('У вас нет прав для просмотра этой страницы. Запросите доступ у администратора.', 'error');
        return;
      }

      titleEl.textContent = 'Все публикации (/blog)';
      document.title = 'Админ-панель — tgtype';
      setStatus('Загрузка публикаций...');

      try {
        const snap = await db.collection('articles').get();
        if (snap.empty) {
          setStatus('Пока нет ни одной статьи.');
          return;
        }

        const posts = [];
        snap.forEach(doc => posts.push({ id: doc.id, ...doc.data() }));
        posts.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

        const searchInput = document.createElement('input');
        searchInput.type = 'text';
        searchInput.className = 'blog-search';
        searchInput.placeholder = 'Поиск по заголовку, ссылке или логину автора...';
        const ul = document.createElement('ul');
        ul.className = 'posts-list';

        function renderList(filterText = '') {
          ul.innerHTML = '';
          const q = filterText.toLowerCase().trim();
          let count = 0;

          posts.forEach(post => {
            const temp = document.createElement('div');
            temp.innerHTML = post.title || post.id;
            const cleanTitle = temp.innerText.trim() || post.id;
            const ownerName = post.ownerLogin || 'неизвестен (старая запись)';

            if (q && !cleanTitle.toLowerCase().includes(q) && !post.id.toLowerCase().includes(q) && !ownerName.toLowerCase().includes(q)) {
              return;
            }
            count++;

            const dateStr = post.updatedAt ? new Date(post.updatedAt).toLocaleString('ru-RU', {
              day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
            }) : '—';
            const fullUrl = `${window.location.origin}/${post.id}`;

            const li = document.createElement('li');
            li.className = 'post-item';
            li.innerHTML = `
              <div class="post-info">
                <a href="/${post.id}">${cleanTitle}</a>
                <div class="post-meta">/${post.id} • Автор: <b>${ownerName}</b> • Изменено: ${dateStr}</div>
              </div>
              <div class="post-actions">
                <button class="mini-btn copy-btn" type="button">Копировать</button>
                <button class="mini-btn del del-btn" type="button">Удалить</button>
              </div>
            `;

            li.querySelector('.copy-btn').addEventListener('click', (e) => {
              navigator.clipboard?.writeText(fullUrl);
              e.target.textContent = 'Скопировано!';
              setTimeout(() => e.target.textContent = 'Копировать', 1500);
            });

            li.querySelector('.del-btn').addEventListener('click', async () => {
              if (!confirm(`Точно удалить статью «${cleanTitle}» (/${post.id})?`)) return;
              try {
                await db.collection('articles').doc(post.id).delete();
                const idx = posts.indexOf(post);
                if (idx > -1) posts.splice(idx, 1);
                renderList(searchInput.value);
              } catch (err) {
                alert('Ошибка удаления: ' + err.message);
              }
            });

            ul.appendChild(li);
          });

          setStatus(`Показано статей: ${count} из ${posts.length}`);
        }

        searchInput.addEventListener('input', () => renderList(searchInput.value));
        storyEl.after(searchInput, ul);
        renderList();
      } catch (e) {
        setStatus('Ошибка загрузки списка: ' + e.message, 'error');
      }
    }

    async function loadArticle(slug) {
      setEditable(false);
      setStatus('Загрузка...');
      try {
        const snap = await db.collection('articles').doc(slug).get();
        if (snap.exists) {
          const data = snap.data();
          titleEl.innerHTML = data.title;
          storyEl.innerHTML = data.story;
          currentArticleOwner = data.ownerUid || null;
          
          if (data.customMeta !== undefined) {
            metaInfoEl.textContent = data.customMeta;
          } else {
            const authorDisplay = data.ownerLogin || (data.author ? data.author.replace(/<[^>]*>/g, '').trim() : '');
            renderMeta(authorDisplay, data.updatedAt);
          }

          document.title = titleEl.innerText || 'tgtype';
          setStatus('');
          actionBtn.textContent = 'EDIT';
          isViewMode = true;
          updateEditVisibility();
        } else {
          setStatus('Страница не найдена. Можете создать её здесь!');
          setEditable(true);
        }
      } catch (e) {
        setStatus('Ошибка загрузки: ' + e.message, 'error');
      }
    }

    function setEditable(canEdit) {
      titleEl.contentEditable = canEdit;
      storyEl.contentEditable = canEdit;
      toolbar.style.display = canEdit ? 'flex' : 'none';
      // Админ может редактировать строку под заголовком как обычный текст
      metaInfoEl.contentEditable = (canEdit && currentUser && isAdmin(currentUser));
    }

    function slugify(text) {
      const map = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
      return text.toLowerCase().split('').map(c => map[c] || c).join('')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'post-' + Date.now();
    }

    actionBtn.addEventListener('click', async () => {
      if (!db || !auth) return;

      if (!currentUser) {
        authModal.style.display = 'flex';
        loginInput.focus();
        return;
      }

      if (isViewMode) {
        isViewMode = false;
        setEditable(true);
        actionBtn.textContent = 'PUBLISH';
        return;
      }

      const titleText = titleEl.innerText.trim();
      if (!titleText) {
        alert('Введите заголовок (Title)!');
        return;
      }

      actionBtn.disabled = true;
      setStatus('Публикация...');

      try {
        let targetSlug = currentSlug;
        if (!targetSlug) {
          let baseSlug = slugify(titleText);
          targetSlug = baseSlug;
          let counter = 1;
          while ((await db.collection('articles').doc(targetSlug).get()).exists) {
            targetSlug = `${baseSlug}${counter++}`;
          }
        }

        const now = Date.now();
        const payload = {
          title: titleEl.innerHTML,
          story: storyEl.innerHTML,
          updatedAt: now
        };

       if (isAdmin(currentUser)) {
          payload.customMeta = metaInfoEl.innerText.trim();
        } else {
          payload.customMeta = firebase.firestore.FieldValue.delete();
        }

        if (!currentArticleOwner) {
          payload.ownerUid = currentUser.uid;
          payload.ownerLogin = getLoginName(currentUser);
          currentArticleOwner = currentUser.uid;
        }

        await db.collection('articles').doc(targetSlug).set(payload, { merge: true });

        if (isAdmin(currentUser)) {
          metaInfoEl.textContent = payload.customMeta;
        } else {
          renderMeta(payload.ownerLogin || getLoginName(currentUser), now);
        }

        currentSlug = targetSlug;
        window.history.pushState({}, '', '/' + targetSlug);
        document.title = titleText;
        isViewMode = true;
        setEditable(false);
        actionBtn.textContent = 'EDIT';
        updateEditVisibility();
        setStatus('Опубликовано! Ссылка скопирована в буфер.', 'ok');
        navigator.clipboard?.writeText(window.location.href);
      } catch (e) {
        setStatus('Ошибка публикации: ' + e.message, 'error');
      } finally {
        actionBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
