<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Микрозаймы</title>
  <style>
    :root { --vzo-orange: #ff6e00; --border-color: #e2e8f0; --text-dark: #1e293b; --text-muted: #64748b; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #f8fafc; margin: 0; padding: 0; color: var(--text-dark); }
    .container { max-width: 1000px; margin: 0 auto; padding: 10px; }
    .top-content { padding: 20px 5px; text-align: left; }
    .top-content h1 { font-size: 28px; font-weight: 800; margin: 0; color: #000; }
    .top-content p { font-size: 15px; color: var(--text-muted); margin: 8px 0 15px 0; max-width: 600px; }
    .offers-count { display: block; font-weight: 800; color: #000; font-size: 16px; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; } }
    .card { background: #fff; border-radius: 12px; padding: 15px 12px; display: flex; flex-direction: column; border: 1px solid var(--border-color); box-sizing: border-box; }
    .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .mfo-logo { width: 32px; height: 32px; border-radius: 6px; object-fit: contain; flex-shrink: 0; }
    .logo-name { font-size: 12px; font-weight: 800; text-transform: uppercase; color: #000; line-height: 1.1; }
    .props-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; flex-grow: 1; }
    .item { display: flex; flex-direction: column; padding-bottom: 4px; border-bottom: 1px solid #f1f5f9; }
    .item:last-child { border-bottom: none; }
    .label { font-size: 9px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .value { font-size: 12px; font-weight: 700; color: #111; }
    .btn { background: var(--vzo-orange); color: white; text-align: center; padding: 12px 2px; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 14px; margin-top: auto; transition: 0.2s; cursor: pointer; }
    .btn:hover { filter: brightness(0.85); }
    footer { text-align: center; padding: 40px 20px; margin-top: 20px; border-top: 1px solid var(--border-color); }
    .home-link { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-content">
      <h1>Микрозаймы</h1>
      <p>Выбирайте подходящие микрозаймы и оформляйте заявку для получения денег на карту онлайн</p>
      <span class="offers-count"><span id="total-offers">0</span> предложений:</span>
    </div>
    
    <!-- Сюда скрипт сам подставит карточки -->
    <div class="grid" id="cards-grid"></div>

    <footer><a href="/" class="home-link">← На главную</a></footer>
  </div>

  <script>
    // УПРАВЛЕНИЕ КАРТОЧКАМИ (ставь // в начале строки, чтобы отключить или оставить заметку)
    const offers = [
      // ТОП МФО
      { name: "Займер", domain: "https://zaymer.ru", link: "/zaymer", sum: "до 35 000 ₽", term: "до 30 дней", free: "30 дней", rate: "0.8%", age: "от 18 лет" },
      { name: "Moneyman", domain: "https://moneyman.ru", link: "/moneyman", sum: "до 30 000 ₽", term: "до 30 дней", free: "21 день", rate: "0.8%", age: "от 20 лет" },
      { name: "Web-Zaim", domain: "https://web-zaim.ru", link: "/web-zaim", sum: "до 30 000 ₽", term: "до 30 дней", free: "14 дней", rate: "0.8%", age: "от 18 лет" },
      { name: "еКапуста", domain: "https://ekapusta.com", link: "/ekapusta", sum: "до 30 000 ₽", term: "до 21 дня", free: "21 день", rate: "0.8%", age: "от 18 лет" },
      { name: "JoyMoney", domain: "https://joymoney.ru", link: "/joymoney", sum: "до 29 000 ₽", term: "до 30 дней", free: "нет", rate: "0.8%", age: "от 21 года" },
      { name: "До Зарплаты", domain: "https://dozarplati.com", link: "/dozarplati", sum: "до 100 000 ₽", term: "до 12 мес.", free: "нет", rate: "0.8%", age: "от 18 лет" },
      { name: "Finfive", domain: "https://finfive.ru", link: "/finfive", sum: "до 30 000 ₽", term: "до 30 дней", free: "нет", rate: "0.8%", age: "от 18 лет" },
      { name: "ВЭББАНКИР", domain: "https://webbankir.com", link: "/webbankir", sum: "до 30 000 ₽", term: "до 30 дней", free: "30 дней", rate: "0%", age: "от 20 лет" },
      
      // Пример отключенной карточки:
      // { name: "credit7", domain: "https://credit7.ru", link: "/credit7", sum: "до 30 000 ₽", term: "до 30 дней", free: "7 дней", rate: "0.8%", age: "от 18 лет" },
    ];

    // Отрисовка карточек и подсчёт количества (этот блок трогать не нужно)
    const grid = document.getElementById('cards-grid');
    document.getElementById('total-offers').innerText = offers.length;

    grid.innerHTML = offers.map(item => `
      <div class="card">
        <div class="card-header">
          <img src="https://yandex.net{item.domain}?size=32" class="mfo-logo">
          <div class="logo-name">${item.name}</div>
        </div>
        <div class="props-list">
          <div class="item"><span class="label">Сумма</span><span class="value">${item.sum}</span></div>
          <div class="item"><span class="label">Срок</span><span class="value">${item.term}</span></div>
          <div class="item"><span class="label">Срок без %</span><span class="value">${item.free}</span></div>
          <div class="item"><span class="label">Ставка</span><span class="value">${item.rate}</span></div>
          <div class="item"><span class="label">Возраст</span><span class="value">${item.age}</span></div>
        </div>
        <a href="${item.link}" class="btn">Получить</a>
      </div>
    `).join('');
  </script>
</body>
</html>
