<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Переход на сайт...</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f7f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; color: #333; }
    .box { padding: 30px; max-width: 400px; width: 90%; border: 1px solid #f0f0f0; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); background: #fff; position: relative; box-sizing: border-box; }
    .spinner { width: 40px; height: 40px; border: 4px solid #f1f5f9; border-top: 4px solid #1a73e8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .mini-card { display: flex; align-items: center; gap: 15px; background: #f8fafc; padding: 15px; border-radius: 20px; margin-bottom: 25px; border: 1px solid #e2e8f0; text-align: left; }
    .mini-logo { width: 45px; height: 45px; border-radius: 12px; object-fit: contain; background: #fff; border: 1px solid #eee; flex-shrink: 0; }
    .mini-info { line-height: 1.3; }
    .mini-name { font-weight: 800; font-size: 18px; color: #000; display: block; }
    .mini-label { font-size: 12px; color: #64748b; font-weight: 500; }
    .icon { font-size: 40px; margin-bottom: 10px; }
    h1 { font-size: 22px; margin-bottom: 12px; color: #000; font-weight: 800; margin-top: 0; }
    p { color: #666; line-height: 1.6; margin-bottom: 20px; font-size: 15px; }
    .badge { background: #eb4d4b; color: white; padding: 4px 12px; border-radius: 8px; font-weight: bold; display: inline-flex; align-items: center; vertical-align: middle; }
    .flag-circle { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; margin-left: 8px; border: 1px solid rgba(255,255,255,0.3); }
    .btn { display: block; background: #1a73e8; color: white; padding: 18px; text-decoration: none; border-radius: 15px; font-weight: bold; font-size: 18px; transition: 0.2s; box-shadow: 0 4px 12px rgba(26,115,232,0.2); margin-bottom: 20px; cursor: pointer; }
    .btn:active { transform: scale(0.97); }
    .secondary-link { display: inline-block; color: #64748b; text-decoration: none; font-weight: 600; font-size: 14px; padding: 10px; transition: 0.2s; }
    .secondary-link:hover { color: #1a73e8; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="box" id="loader-box">
    <div class="spinner"></div>
    <p style="margin-bottom: 0;">Проверяем соединение...</p>
  </div>

  <div class="box hidden" id="vpn-box">
    <div class="mini-card" id="mini-card">
      <img id="mfo-logo" src="" class="mini-logo" onerror="this.style.display='none'">
      <div class="mini-info">
        <span class="mini-label">Вы переходите в:</span>
        <span class="mini-name" id="mfo-name"></span>
      </div>
    </div>
     <div class="icon">📍</div>
    <h1>Нужно выключить VPN</h1>
    <p id="region-row"></p>
    <p id="vpn-reason">Сайт доступен только для жителей <b>России</b>. Пожалуйста, отключите VPN и нажмите кнопку ниже.</p>
    <a href="javascript:location.reload();" class="btn">Я отключил VPN, продолжить</a>
    <a href="/mfo.html" class="secondary-link">← Назад</a>
  </div>

  <script>
    const OFFERS = {
      'zaymer': 'https://zaymer.ru',
      'moneyman': 'https://moneyman.ru',
      'web-zaim': 'https://web-zaim.ru',
      'ekapusta': 'https://ekapusta.com',
      'joymoney': 'https://joymoney.ru',
      'dozarplati': 'https://dozarplati.com',
      'finfive': 'https://finfive.ru',
      'smartcash': 'https://smartcash.ru',
      'turbozaim': 'https://turbozaim.ru',
      'srochnodengi': 'https://srochnodengi.ru',
      'dengisrazy': 'https://dengisrazy.ru',
      'skelamoney': 'https://skelamoney.ru',
      'dobrozaim': 'https://dobrozaim.ru',
      'finters': 'https://finters.ru',
      'denga': 'https://denga.ru',
      'privetsosed': 'https://privetsosed.ru',
      'beriberu': 'https://beriberu.ru',
      'krediska': 'https://krediska.ru',
      'webbankir': 'https://webbankir.com',
      'credit7': 'https://credit7.ru'
    };

    const params = new URLSearchParams(window.location.search);
    const offerKey = params.get('offer');
    const targetUrl = OFFERS[offerKey];

    if (!targetUrl) {
      window.location.replace('/mfo.html');
    } else {
      checkVpnAndRedirect();
    }

    // Автоматически подтягиваем логотип и название карточки из mfo.html
    async function loadCardInfoFromMfoHtml(slug) {
      try {
        const res = await fetch('/mfo.html', { cache: 'no-store' });
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const link = doc.querySelector(`a[href="/${slug}"], a[href="${slug}"]`);
        if (link) {
          const card = link.closest('.card');
          if (card) {
            const nameEl = card.querySelector('.logo-name');
            const logoEl = card.querySelector('.mfo-logo');
            if (nameEl) document.getElementById('mfo-name').innerText = nameEl.innerText.trim();
            if (logoEl && logoEl.getAttribute('src')) {
              document.getElementById('mfo-logo').src = logoEl.getAttribute('src');
            }
            return;
          }
        }
      } catch (e) {}
      // Если вдруг не нашлось в mfo.html — просто ставим ключ заглавными
      document.getElementById('mfo-name').innerText = slug.toUpperCase();
      document.getElementById('mfo-logo').style.display = 'none';
    }

    async function showVpnBlock(reasonText, countryCode) {
      await loadCardInfoFromMfoHtml(offerKey);
      document.title = 'Доступ ограничен';

      const regionRow = document.getElementById('region-row');
      if (countryCode) {
        document.getElementById('country-code').innerText = countryCode;
        document.getElementById('country-flag').src = 'https://flagcdn.com' + countryCode.toLowerCase() + '.png';
        regionRow.classList.remove('hidden');
      } else {
        regionRow.classList.add('hidden');
      }

      if (reasonText) {
        document.getElementById('vpn-reason').innerHTML = reasonText;
      }
      document.getElementById('loader-box').classList.add('hidden');
      document.getElementById('vpn-box').classList.remove('hidden');
    }

    async function getCountryCode() {
      // 1. Основной быстрый API (Cloudflare)
      try {
        const res1 = await fetch('https://country.is', { cache: 'no-store' });
        const data1 = await res1.json();
        if (data1 && data1.country) return data1.country.toUpperCase();
      } catch (e) {}

      // 2. Резервный API, если первый недоступен
      try {
        const res2 = await fetch('https://ip2location.io', { cache: 'no-store' });
        const data2 = await res2.json();
        if (data2 && data2.country_code) return data2.country_code.toUpperCase();
      } catch (e) {}

      // 3. Третий резервный API
      try {
        const res3 = await fetch('https://ipwho.is', { cache: 'no-store' });
        const data3 = await res3.json();
        if (data3 && data3.country_code) return data3.country_code.toUpperCase();
      } catch (e) {}

      return null;
    }

    async function checkVpnAndRedirect() {
      const country = await getCountryCode();

      if (!country) {
        await showVpnBlock('Не удалось проверить соединение. Отключите VPN или блокировщик рекламы и нажмите кнопку ниже.', null);
        return;
      }

      if (country !== 'RU') {
        await showVpnBlock(null, country);
        return;
      }

      window.location.replace(targetUrl);
    }
  </script>
</body>
</html>
